    function calculateSim() {
      const out = document.getElementById('sim-result');
      if (!out) return;
      const val = parseFloat(document.getElementById('sim-value').value) || 0;
      const mode = document.getElementById('sim-mode').value;
      const parcelsEl = document.getElementById('sim-parcels');
      parcelsEl.disabled = mode === 'cash';
      const parcels = mode === 'cash' ? 1 : Math.max(1, parseInt(parcelsEl.value, 10) || 1);
      if (!(val > 0)) { out.innerHTML = '<span class="text-[#8B7D95]">Informe o valor da compra.</span>'; return; }

      const key = isoDay(new Date()).slice(0, 7);
      const doMes = finTx.filter(t => t.date.slice(0, 7) === key);
      const saldo = doMes.filter(t => t.type === 'in').reduce((s, t) => s + t.amount, 0)
                  - doMes.filter(t => t.type === 'out').reduce((s, t) => s + t.amount, 0);
      const parcela = val / parcels;
      const simCardEl = document.getElementById('sim-card'), simCard = finCard(simCardEl ? parseInt(simCardEl.value, 10) : (finances.cards[0] ? finances.cards[0].id : null));
      const limiteDepois = simCard ? simCard.limit - simCard.used - val : -val;
      const saldoDepois = saldo - parcela;

      const problemas = [];
      if (mode === 'card' && !simCard) problemas.push('Cadastre um cartão para simular a compra parcelada.');
      else if (mode === 'card' && limiteDepois < 0) problemas.push('Faltam ' + fmtBRL(-limiteDepois) + ' de limite' + (simCard ? ' no ' + simCard.name : ' no cartão') + '.');
      if (saldo <= 0) problemas.push('O saldo de ' + finMonthLabel(key) + ' está zerado ou negativo.');
      else if (parcela > saldo) problemas.push('A ' + (parcelas1(parcels)) + ' passa do saldo do mês em ' + fmtBRL(-saldoDepois) + '.');

      let level, titulo, extra = '';
      if (problemas.length) { level = 'bad'; titulo = 'Não cabe'; extra = problemas.join(' '); }
      else if (parcela > saldo * 0.5) { level = 'warn'; titulo = 'Cabe, mas aperta'; extra = 'A ' + parcelas1(parcels) + ' usa ' + Math.round((parcela / saldo) * 100) + '% do saldo do mês.'; }
      else { level = 'ok'; titulo = 'Cabe'; extra = 'A ' + parcelas1(parcels) + ' usa ' + Math.round((parcela / saldo) * 100) + '% do saldo do mês.'; }

      const cor = { ok: 'var(--ste-ok)', warn: '#C6A467', bad: '#dc2626' }[level];
      const txt = { ok: 'text-emerald-600 dark:text-emerald-400', warn: 'text-[#9E7E45] dark:text-[#DAB97C]', bad: 'text-red-600 dark:text-red-400' }[level];
      const linhaCompra = mode === 'cash' ? 'À vista: ' + fmtBRL(val) : parcels + '× de ' + fmtBRL(parcela);
      out.innerHTML =
        '<div class="pl-3" style="border-left:4px solid ' + cor + '">' +
          '<p class="text-sm font-bold ' + txt + '">' + titulo + '</p>' +
          '<p class="mt-0.5 text-[#2A1730] dark:text-[#F7EDFB] font-medium">' + extra + '</p>' +
          '<ul class="mt-2 space-y-0.5 text-[#8B7D95] dark:text-[#C1B1CB] font-medium">' +
            '<li>' + linhaCompra + '</li>' +
            (mode === 'card' ? '<li>Limite livre depois: ' + fmtBRL(limiteDepois) + '</li>' : '') +
            '<li>Saldo do mês depois' + (parcels > 1 ? ' da 1ª parcela' : '') + ': ' + fmtBRL(saldoDepois) + '</li>' +
          '</ul>' +
          (parcels > 1 ? '<p class="mt-2 text-[10px] text-[#8B7D95] dark:text-[#C1B1CB]">Compara com o saldo de ' + finMonthLabel(key) + ' e supõe que ele se repete nos próximos meses.</p>' : '') +
        '</div>';
    }

      container.innerHTML = '<header class="mb-6"><p class="text-xs uppercase font-bold tracking-widest text-[#A56ABD]">Criação</p><h1 class="font-serif-display text-3xl font-bold">Planejador de Conteúdo</h1><p class="text-xs md:text-sm text-[#8B7D95]">Calendário de publicações do TikTok, etapas de produção e resultados dos posts</p></header>' +
        '<div class="dx-grid">' + cpFormHtml() +
        '<section class="dx-card"><div class="dx-head"><h2>Calendário</h2><div class="dx-flex" style="gap:4px"><button type="button" class="dx-iconbtn" onclick="cpShift(-1)" aria-label="Mês anterior">' + ico('chevron-left', 18) + '</button><button type="button" class="dx-iconbtn" onclick="cpShift(1)" aria-label="Próximo mês">' + ico('chevron-right', 18) + '</button></div></div><p class="dx-muted" style="margin:-6px 0 10px">' + PT_MESES[mo] + ' de ' + y + (cpSel ? ' · filtrando ' + fmtDM(cpSel) + ' (toque de novo para limpar)' : '') + '</p><div class="dx-cal">' + cells + '</div>' +
        '<div class="dx-flex" style="margin-top:12px"><button type="button" class="dx-btn sm" onclick="cpNew()">+ Novo post</button></div></section>' +
        '<section class="dx-card"><div class="dx-head"><h2>Meta da semana</h2></div><div class="dx-stat"><small>Publicações</small><strong>' + wkPub + (cpData.goal ? ' / ' + cpData.goal : '') + '</strong><em>' + goalTxt + '</em></div>' + (cpData.goal ? '<div class="dx-bar" style="margin-top:10px"><b style="width:' + Math.min(100, Math.round(wkPub / cpData.goal * 100)) + '%"></b></div>' : '') +
        '<label class="dx-lbl" for="cp-goal">Posts por semana</label><input id="cp-goal" class="dx-in" inputmode="numeric" maxlength="2" value="' + (cpData.goal || '') + '" onchange="cpSetGoal(this.value)" style="max-width:110px"><p class="dx-msg" role="status" aria-live="polite">' + esc(cpMsg) + '</p></section>' +
        '<section class="dx-card dx-span2"><div class="dx-head"><h2>Posts</h2></div><div class="dx-flex" style="margin-bottom:6px"><button type="button" class="dx-sel" aria-pressed="' + (cpFilter === 'todos') + '" onclick="cpSetFilter(\'todos\')">Todos · ' + cpData.posts.length + '</button>' + CP_STATUS.map(s => '<button type="button" class="dx-sel" aria-pressed="' + (cpFilter === s[0]) + '" onclick="cpSetFilter(\'' + s[0] + '\')">' + s[1] + ' · ' + (counts[s[0]] || 0) + '</button>').join('') + '</div>' +
        (list.length ? list.map(cpPostHtml).join('') : '<p class="dx-empty">' + (cpData.posts.length ? 'Nenhum post neste filtro.' : 'Nenhum post planejado ainda. Toque em “+ Novo post” para começar.') + '</p>') + '</section>' +
        '<section class="dx-card"><div class="dx-head"><h2>Resultados</h2></div>' + cpResultsHtml() + '</section>' +
        '<section class="dx-card"><div class="dx-head"><h2>Banco de ideias</h2><button type="button" class="dx-link" onclick="navigate(\'estudos\')">Abrir ' + ico('arrow-right', 13) + '</button></div>' + (ideas.length ? ideas.map(i => '<div class="dx-row"><span class="ic">' + ico('lightbulb', 18) + '</span><span class="tx"><b style="white-space:normal">' + esc(i.text) + '</b></span><button type="button" class="dx-btn sm ghost" onclick="cpFromIdea(' + i.id + ')">Planejar</button></div>').join('') : '<p class="dx-empty">Nenhuma ideia livre no Banco de Ideias (Estudos). Anote ideias por lá ou pela captura rápida.</p>') + '</section></div>';
    }

    let saudeTab = 'resumo';
    const SAUDE_TABS = [['resumo', 'Resumo'], ['corpo', 'Corpo'], ['nutricao', 'Nutrição'], ['mente', 'Sono e humor'], ['medico', 'Consultas e remédios']];
    function saudeSetTab(k) { saudeTab = k; renderScreen(); window.scrollTo({ top: 0, behavior: steScroll() }); }
    function saudeTabsHtml() { return '<div class="dx-seg scroll" role="tablist" aria-label="Seções da Saúde">' + SAUDE_TABS.map(t => '<button type="button" role="tab" aria-selected="' + (saudeTab === t[0]) + '" class="' + (saudeTab === t[0] ? 'on' : '') + '" onclick="saudeSetTab(\'' + t[0] + '\')">' + t[1] + '</button>').join('') + '</div>'; }
    let academiaTab = 'hoje';
    const ACAD_TABS = [['hoje', 'Treino de hoje'], ['semana', 'Semana e mês'], ['fichas', 'Minhas fichas'], ['evolucao', 'Evolução']];
    function academiaSetTab(k) { academiaTab = k; renderScreen(); window.scrollTo({ top: 0, behavior: steScroll() }); }
    function academiaTabsHtml() { return '<div class="dx-seg scroll" role="tablist" aria-label="Seções da Academia">' + ACAD_TABS.map(t => '<button type="button" role="tab" aria-selected="' + (academiaTab === t[0]) + '" class="' + (academiaTab === t[0] ? 'on' : '') + '" onclick="academiaSetTab(\'' + t[0] + '\')">' + t[1] + '</button>').join('') + '</div>'; }
    let finTab = 'mes';
    const FIN_TABS = [['mes', 'Mês'], ['lancamentos', 'Lançamentos'], ['contas', 'Contas e metas'], ['cartoes', 'Cartões e compras'], ['ano', 'Ano']];
    function finSetTab(k) { finTab = k; renderScreen(); window.scrollTo({ top: 0, behavior: steScroll() }); }
    function finTabsHtml() { return '<div class="dx-seg scroll" role="tablist" aria-label="Seções de Finanças">' + FIN_TABS.map(t => '<button type="button" role="tab" aria-selected="' + (finTab === t[0]) + '" class="' + (finTab === t[0] ? 'on' : '') + '" onclick="finSetTab(\'' + t[0] + '\')">' + t[1] + '</button>').join('') + '</div>'; }
    let habTab = 'habitos';
    const HAB_TABS = [['habitos', 'Hábitos e contadores'], ['resumos', 'Resumos'], ['modelos', 'Modelos de rotina']];
    function habSetTab(k) { habTab = k; renderScreen(); window.scrollTo({ top: 0, behavior: steScroll() }); }
    function habTabsHtml() { return '<div class="dx-seg scroll" role="tablist" aria-label="Seções de Hábitos">' + HAB_TABS.map(t => '<button type="button" role="tab" aria-selected="' + (habTab === t[0]) + '" class="' + (habTab === t[0] ? 'on' : '') + '" onclick="habSetTab(\'' + t[0] + '\')">' + t[1] + '</button>').join('') + '</div>'; }
    let eduTab = 'estudo';
    const EDU_TABS = [['estudo', 'Estudos'], ['diario', 'Diário e resumo'], ['ideias', 'Ideias (TikTok)']];
    function eduSetTab(k) { eduTab = k; renderScreen(); window.scrollTo({ top: 0, behavior: steScroll() }); }
    function eduTabsHtml() { return '<div class="dx-seg scroll" role="tablist" aria-label="Seções de Estudos e Carreira">' + EDU_TABS.map(t => '<button type="button" role="tab" aria-selected="' + (eduTab === t[0]) + '" class="' + (eduTab === t[0] ? 'on' : '') + '" onclick="eduSetTab(\'' + t[0] + '\')">' + t[1] + '</button>').join('') + '</div>'; }
    let sonhosTab = 'sonhos';
    const SONHOS_TABS = [['sonhos', 'Sonhos'], ['fe', 'Fé e gratidão']];
    function sonhosSetTab(k) { sonhosTab = k; renderScreen(); window.scrollTo({ top: 0, behavior: steScroll() }); }
    function sonhosTabsHtml() { return '<div class="dx-seg scroll" role="tablist" aria-label="Seções de Sonhos e Fé">' + SONHOS_TABS.map(t => '<button type="button" role="tab" aria-selected="' + (sonhosTab === t[0]) + '" class="' + (sonhosTab === t[0] ? 'on' : '') + '" onclick="sonhosSetTab(\'' + t[0] + '\')">' + t[1] + '</button>').join('') + '</div>'; }
    hydrateIcons();
    initTheme();
    renderNav();
    const firstOpenToday = dailyPrepare();
    renderScreen();
    if (firstOpenToday) showDailyPopup();
    remStart();
    setInterval(() => {
      if (currentScreen !== 'hoje' || document.hidden) return;
      const t = document.getElementById('sum-next');
      if (t) t.innerHTML = nextEventTileInner();
    }, 60000);

    // ================= Captura rápida: digita uma frase, o STE sugere o destino e você confirma =================
    const QC_DESTS = { tarefa: 'Tarefa', compromisso: 'Compromisso', gasto: 'Gasto', receita: 'Receita', nota: 'Nota', ideia: 'Ideia de conteúdo' };
    let qcState = null;
    function qcAddDays(iso, n) { const p = iso.split('-').map(Number); return isoDay(new Date(p[0], p[1] - 1, p[2] + n)); }
    function qcCap(t) { return t ? t.charAt(0).toUpperCase() + t.slice(1) : t; }
    function qcParse(raw) {
      const text = raw.trim(), low = pgNorm(text), hoje = isoDay(new Date());
      const r = { dest: 'tarefa', title: text, date: '', time: '', valor: '', cat: '' };
      const pre = text.match(/^(ideia|nota|anota[cç][aã]o|anotar)\s*[:\-]\s*/i);
      if (pre) { r.dest = /^ideia/i.test(pre[1]) ? 'ideia' : 'nota'; r.title = text.slice(pre[0].length).trim(); return r; }
      const mon = text.match(/r\$\s*([\d.]+(?:,\d{1,2})?)/i) || text.match(/([\d.]+(?:,\d{1,2})?)\s*(?:reais|conto)/i) || text.match(/\b(?:gastei|paguei|comprei|recebi|ganhei)\s+(?:um|uma)?\s*([\d.]+(?:,\d{1,2})?)/i);
      const ehIn = /\b(recebi|ganhei|entrou|receita|salario)\b/.test(low), ehOut = /\b(gastei|paguei|comprei|gasto|pago)\b/.test(low);
      if (mon && !isNaN(parseMoney(mon[1])) && parseMoney(mon[1]) > 0) {
        r.dest = ehIn && !ehOut ? 'receita' : 'gasto'; r.valor = parseMoney(mon[1]).toFixed(2).replace('.', ',');
        let t = text.replace(/r\$\s*[\d.]+(?:,\d{1,2})?/i, ' ').replace(/[\d.]+(?:,\d{1,2})?\s*(?:reais|conto)s?/i, ' ').replace(/\s+/g, ' ').trim();
        t = t.replace(/^(gastei|paguei|comprei|recebi|ganhei)\s+(?:um|uma)?\s*(?:[\d.]+(?:,\d{1,2})?\s*)?/i, '').replace(/^(no|na|nos|nas|de|do|da|em|com|para|pra)\s+/i, '').trim();
        r.title = qcCap(t) || (r.dest === 'receita' ? 'Receita' : 'Gasto'); r.date = hoje; r.cat = r.dest === 'receita' ? 'Outras' : 'Outras';
        return r;
      }
      const tm = low.match(/\b(\d{1,2})(?:h(\d{2})?|:(\d{2}))\b/);
      if (tm && +tm[1] < 24 && +(tm[2] || tm[3] || 0) < 60) r.time = pad2(+tm[1]) + ':' + pad2(+(tm[2] || tm[3] || 0));
      let dt = '';
      const dm = low.match(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/), wd = low.match(/\b(domingo|segunda|terca|quarta|quinta|sexta|sabado)\b/), dd = low.match(/\bdia\s+(\d{1,2})\b/);
      if (/\bdepois de amanha\b/.test(low)) dt = qcAddDays(hoje, 2);
      else if (/\bamanha\b/.test(low)) dt = qcAddDays(hoje, 1);
      else if (/\bhoje\b/.test(low)) dt = hoje;
      else if (dm) { const y = dm[3] ? (dm[3].length === 2 ? 2000 + +dm[3] : +dm[3]) : +hoje.slice(0, 4); let c = y + '-' + pad2(+dm[2]) + '-' + pad2(+dm[1]); if (!dm[3] && validIsoDate(c) && c < hoje) c = (y + 1) + '-' + pad2(+dm[2]) + '-' + pad2(+dm[1]); dt = c; }
      else if (wd) { const dias = ['domingo', 'segunda', 'terca', 'quarta', 'quinta', 'sexta', 'sabado'], alvo = dias.indexOf(wd[1]), cur = new Date().getDay(); dt = qcAddDays(hoje, ((alvo - cur + 7) % 7) || 7); }
      else if (dd) { const y = +hoje.slice(0, 4), m = +hoje.slice(5, 7); let c = y + '-' + pad2(m) + '-' + pad2(+dd[1]); if (validIsoDate(c) && c < hoje) { const n = new Date(y, m, 1); c = n.getFullYear() + '-' + pad2(n.getMonth() + 1) + '-' + pad2(+dd[1]); } dt = c; }
      if (dt && validIsoDate(dt)) r.date = dt;
      let t = text.replace(/\s+(?:às|as)\s+(?=\d{1,2}(?:h|:))/gi, ' ').replace(/\b\d{1,2}(?:h\d{0,2}|:\d{2})\b/gi, ' ')
        .replace(/(^|\s)(depois de amanh[ãa]|amanh[ãa]|hoje)(?=\s|$|[,.;!?])/gi, '$1').replace(/(^|\s)\d{1,2}\/\d{1,2}(?:\/\d{2,4})?(?=\s|$|[,.;!?])/g, '$1').replace(/(^|\s)dia\s+\d{1,2}(?=\s|$|[,.;!?])/gi, '$1')
        .replace(/(^|\s)(?:(?:na|no|para|pra)\s+)?(?:segunda|ter[çc]a|quarta|quinta|sexta|s[áa]bado|domingo)(?:-feira)?(?=\s|$|[,.;!?])/gi, '$1').replace(/\s+/g, ' ').trim();
      for (let i = 0; i < 3; i++) t = t.replace(/\s+(?:às|as|na|no|em|para|pra|dia|de|a)\s*$/i, '').trim();
      r.title = qcCap(t) || text;
      if (r.time) { r.dest = 'compromisso'; if (!r.date) r.date = hoje; }
      return r;
    }
    function qcOpen() {
      if (document.getElementById('qc-ov')) return;
      const ov = document.createElement('div'); ov.id = 'qc-ov'; ov.className = 'qc-ov'; ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-modal', 'true'); ov.setAttribute('aria-label', 'Captura rápida');
      ov.innerHTML = '<div class="qc-box"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px"><h2 class="font-serif-display" style="font-size:20px;font-weight:700">Captura rápida</h2><button type="button" onclick="qcClose()" aria-label="Fechar" style="background:none;border:0;color:var(--text-muted);cursor:pointer">' + ico('x', 18) + '</button></div>' +
        '<textarea id="qc-text" class="qc-in" rows="3" maxlength="300" placeholder="Escreva do jeito que vier: dentista amanhã 14h, gastei R$ 40 no mercado, ideia: reels sobre rotina..." aria-label="O que você quer guardar"></textarea>' +
        '<button type="button" onclick="qcSuggest()" class="px-4 py-2 mt-2 bg-[#A56ABD] text-white font-bold text-xs rounded-lg" style="background:var(--primary);color:#fff;font-weight:700;font-size:12px;padding:8px 16px;border-radius:10px;border:0;cursor:pointer;margin-top:8px">Sugerir destino</button>' +
        '<div id="qc-panel" aria-live="polite" style="margin-top:14px"></div></div>';
      ov.addEventListener('mousedown', e => { if (e.target === ov) qcClose(); });
      ov.addEventListener('keydown', e => { if (e.key === 'Escape') qcClose(); });
      document.body.appendChild(ov); qcState = null;
      const ta = document.getElementById('qc-text');
      ta.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); qcSuggest(); } });
      setTimeout(() => ta.focus(), 0);
    }
    function qcClose() { const ov = document.getElementById('qc-ov'); if (ov) ov.remove(); qcState = null; }
    function qcSuggest() {
      const ta = document.getElementById('qc-text'), raw = ta ? ta.value : '';
      if (!raw.trim()) { const p = document.getElementById('qc-panel'); if (p) p.innerHTML = '<p style="font-size:12px;color:var(--text-muted)">Escreva algo primeiro.</p>'; return; }
      qcState = qcParse(raw); qcState.raw = raw.trim(); qcState.suggested = qcState.dest; qcPanel();
    }
    function qcSync() {
      if (!qcState) return;
      ['title', 'date', 'time', 'valor', 'cat'].forEach(k => { const e = document.getElementById('qc-' + k); if (e) qcState[k] = e.value; });
    }
    function qcSetDest(d) { qcSync(); const antes = qcState.dest; qcState.dest = d; if ((d === 'gasto' || d === 'receita') && !qcState.date) qcState.date = isoDay(new Date()); if (d === 'compromisso' && !qcState.date) qcState.date = isoDay(new Date()); if (antes !== d && (d === 'gasto' || d === 'receita')) qcState.cat = 'Outras'; qcPanel(); }
    function qcPanel() {
      const p = document.getElementById('qc-panel'); if (!p || !qcState) return;
      const st = qcState, d = st.dest, lab = (t, id, inner) => '<label style="display:block;font-size:10px;font-weight:700;text-transform:uppercase;color:var(--text-muted);margin-top:8px">' + t + inner + '</label>';
      const chips = Object.keys(QC_DESTS).map(k => '<button type="button" role="radio" class="qc-chip" aria-checked="' + (k === d) + '" onclick="qcSetDest(\'' + k + '\')">' + QC_DESTS[k] + (k === st.suggested ? ' · sugestão' : '') + '</button>').join(' ');
      let campos = lab(d === 'ideia' ? 'Ideia' : d === 'nota' ? 'Título da nota' : d === 'gasto' || d === 'receita' ? 'Descrição' : 'Título', '', '<input id="qc-title" class="qc-in" maxlength="140" value="' + esc(st.title) + '">');
      if (d === 'tarefa') campos += lab('Prazo (opcional)', '', '<input id="qc-date" type="date" class="qc-in" value="' + esc(st.date) + '">');
      if (d === 'compromisso') campos += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">' + lab('Data', '', '<input id="qc-date" type="date" class="qc-in" value="' + esc(st.date) + '">') + lab('Hora (opcional)', '', '<input id="qc-time" type="time" class="qc-in" value="' + esc(st.time) + '">') + '</div>';
      if (d === 'gasto' || d === 'receita') campos += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">' + lab('Valor', '', '<input id="qc-valor" inputmode="decimal" class="qc-in" value="' + esc(st.valor) + '">') + lab('Data', '', '<input id="qc-date" type="date" class="qc-in" value="' + esc(st.date) + '">') + '</div>' +
        lab('Categoria', '', '<select id="qc-cat" class="qc-in">' + FIN_CATS[d === 'receita' ? 'in' : 'out'].map(c => '<option' + (c === st.cat ? ' selected' : '') + '>' + c + '</option>').join('') + '</select>');
      p.innerHTML = '<p style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--gold);margin-bottom:6px">Guardar como</p><div role="radiogroup" aria-label="Destino" style="display:flex;flex-wrap:wrap;gap:6px">' + chips + '</div>' + campos +
        '<p id="qc-msg" aria-live="polite" style="font-size:11px;font-weight:700;color:#c0392b;margin-top:6px"></p>' +
        '<button type="button" onclick="qcSave()" style="margin-top:10px;width:100%;background:var(--primary);color:#fff;font-weight:700;font-size:13px;padding:11px;border-radius:12px;border:0;cursor:pointer">Guardar em ' + QC_DESTS[d] + '</button>' +
        '<p style="font-size:11px;color:var(--text-muted);margin-top:6px;text-align:center">Nada é guardado até você confirmar.</p>';
    }
    function qcToast(msg) {
      const t = document.createElement('div'); t.className = 'qc-toast'; t.setAttribute('role', 'status'); t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
    }
    function qcSave() {
      qcSync(); const st = qcState, msg = document.getElementById('qc-msg'), erro = m => { if (msg) msg.textContent = m; };
      if (!st) return;
      const title = String(st.title || '').trim(), date = st.date || '', d = st.dest;
      if (!title) return erro('Escreva o título.');
      if (date && !validIsoDate(date)) return erro('Data inválida.');
      if (d === 'tarefa') { tasks.push({ id: Date.now(), title: title.slice(0, 140), priority: 'Importante', done: false, cat: '', due: date, subtasks: [], recur: '' }); setStore('tasks', tasks); }
      else if (d === 'compromisso') { if (!date) return erro('Escolha a data.'); events.push({ id: Date.now(), time: st.time || '', title: title.slice(0, 80), place: 'Geral', cat: '', date, recur: '', remind: true }); setStore('events', events); }
      else if (d === 'gasto' || d === 'receita') {
        const v = parseMoney(st.valor); if (!(v > 0)) return erro('Informe um valor maior que zero.');
        finTx.push({ id: Date.now(), type: d === 'receita' ? 'in' : 'out', desc: title.slice(0, 80), amount: Math.round(v * 100) / 100, cat: FIN_CATS[d === 'receita' ? 'in' : 'out'].includes(st.cat) ? st.cat : 'Outras', date: date || isoDay(new Date()), card: false, cardId: null }); setStore('fintx', finTx);
      }
      else if (d === 'nota') { sonhosData.notes = sonhosData.notes.concat({ id: Date.now(), kind: 'Outro', title: title.slice(0, 80), text: st.raw && st.raw.length > title.length ? st.raw.slice(0, 1000) : '', date: isoDay(new Date()) }); saveSonhos(); }
      else if (d === 'ideia') { eduData.ideas.unshift({ id: Date.now(), text: title.slice(0, 140), used: false }); saveEdu(); }
      qcClose(); qcToast('Guardado em ' + QC_DESTS[d]); renderScreen();
    }
    (function qcFab() {
      const mk = () => { if (document.getElementById('qc-fab')) return; const b = document.createElement('button'); b.id = 'qc-fab'; b.type = 'button'; b.className = 'qc-fab'; b.setAttribute('aria-label', 'Captura rápida'); b.innerHTML = ico('plus', 24, '', 2.2); b.onclick = qcOpen; document.body.appendChild(b); };
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mk); else mk();
    })();

    setInterval(() => {
      if (currentScreen !== 'hoje' || document.hidden) return;
      const a = document.activeElement;
      if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;
      if (document.getElementById('steDailyPop') || document.getElementById('pg-ov') || document.getElementById('qc-ov')) return;
      if (hojePrimary(new Date()) !== hojePrimaryKey) renderScreen();
    }, 60000);
    let viewDay = isoDay(new Date());
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) return;
      setTimeout(remTick, 800);
      if (isoDay(new Date()) !== viewDay) { viewDay = isoDay(new Date()); renderScreen(); }
    });
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
      window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
    }
  </script>
