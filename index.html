<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STE — Seu Espaço Pessoal</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#2A2360">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="STE">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <!-- Estilos: usa o ste.css compilado; se o arquivo não existir, cai para o Tailwind via CDN. -->
  <link rel="stylesheet" href="ste.css">
  <script>
    (function () {
      // O ste.css tem a marca --ste-css; se ela não estiver ativa, o arquivo não carregou.
      if (getComputedStyle(document.documentElement).getPropertyValue('--ste-css').trim() === '1') return;
      document.write('<script src="https://cdn.tailwindcss.com"><\/script>');
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    if (window.tailwind) tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#FAF5FC', 100: '#F5EBFA', 200: '#E7DBEF', 300: '#D5BCDF',
              400: '#C08BD8', 500: '#8266C4', 600: '#6A50AB', 700: '#73378A',
              800: '#5A266E', 900: '#2A2360', 950: '#161235',
            },
            gold: { DEFAULT: '#C6A467', light: '#E8D2A7', dark: '#9E7E45' }
          },
          fontFamily: {
            sans: ['Manrope', 'sans-serif'],
            display: ['Fraunces', 'serif'],
          }
        }
      }
    }
  </script>
  <style>
    :root {
      --bg: #F5EBFA;
      --card-bg: #FFFFFF;
      --text-main: #2A1730;
      --text-muted: #8B7D95;
      --border-color: #EFE1F5;
      --primary: #8266C4;
      --gold: #C6A467;
    }
    .dark {
      --bg: #1F0B29;
      --card-bg: #291236;
      --text-main: #F7EDFB;
      --text-muted: #C1B1CB;
      --border-color: #3F234F;
      --primary: #BA7FD1;
      --gold: #DAB97C;
    }
    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Manrope', sans-serif;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .custom-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 20px -8px rgba(73, 34, 91, 0.08);
    }
    .dark .custom-card {
      box-shadow: 0 4px 24px -8px rgba(0, 0, 0, 0.45);
    }
    .font-serif-display {
      font-family: 'Fraunces', serif;
    }
    /* iPhone/iPad dão zoom automático em campos com fonte menor que 16px; sem isso o zoom liberado atrapalharia a digitação. */
    @supports (-webkit-touch-callout: none) {
      input:not([type=checkbox]):not([type=radio]):not([type=file]), select, textarea { font-size: 16px !important; }
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* ---- Ciclo menstrual ---- */
    .cy-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 20px; padding: 18px; margin-bottom: 16px; color: var(--text-main); }
    .cy-h { font-family: 'Fraunces', serif; font-size: 19px; font-weight: 700; margin-bottom: 8px; }
    .cy-note { font-size: 11px; color: var(--text-muted); line-height: 1.45; }
    .cy-leg { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 11px; margin-top: 10px; }
    .cy-leg i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
    .cy-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
    .cy-dow { font-size: 10px; font-weight: 700; color: var(--text-muted); padding: 2px 0; }
    .cy-day { aspect-ratio: 1; border-radius: 50%; border: 2px solid transparent; background: transparent; color: inherit; font: 600 12px 'Manrope', sans-serif; cursor: pointer; display: flex; align-items: center; justify-content: center; position: relative; padding: 0; }
    .cy-day.empty { visibility: hidden; }
    .cy-day.today { border-color: var(--primary); }
    .cy-day.sel { box-shadow: 0 0 0 2px var(--gold); }
    .cy-day.p { background: #D1607A; color: #fff; }
    .cy-day.pp { border: 2px dashed #D1607A; }
    .cy-day.f { background: rgba(198, 164, 103, .28); }
    .cy-day.o::after { content: ''; position: absolute; bottom: 3px; width: 5px; height: 5px; border-radius: 50%; background: #C6A467; }
    .cy-day.fl::before { content: ''; position: absolute; top: 3px; right: 6px; width: 5px; height: 5px; border-radius: 50%; background: #7A8CC4; }
    .cy-chip { padding: 7px 12px; border-radius: 999px; border: 1px solid var(--border-color); background: transparent; color: inherit; font: 700 12px 'Manrope', sans-serif; cursor: pointer; margin: 0 6px 6px 0; }
    .cy-chip[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: #fff; }
    .cy-btn { padding: 9px 14px; border-radius: 12px; border: 0; background: var(--primary); color: #fff; font: 700 12px 'Manrope', sans-serif; cursor: pointer; margin: 0 8px 8px 0; }
    .cy-btn.alt { background: transparent; color: var(--primary); border: 1px solid var(--primary); }
    .cy-in { padding: 8px 10px; border-radius: 10px; border: 1px solid var(--border-color); background: transparent; color: inherit; font: 500 13px 'Manrope', sans-serif; width: 72px; }
    /* ---- Sonhos & Fé: Vision Board ---- */
    .vb-banner { position: relative; border-radius: 22px; overflow: hidden; min-height: 190px; display: flex; align-items: flex-end; border: 1px solid var(--gold); background: linear-gradient(135deg, #5B47A0, #2A2360); color: #fff; }
    .vb-banner img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .vb-banner::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, rgba(24,20,58, .78), rgba(24,20,58, .1) 70%); }
    .vb-banner > div { position: relative; z-index: 1; padding: 18px; width: 100%; }
    .vb-g5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 24px; }
    .vb-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 24px; }
    .vb-two { display: grid; grid-template-columns: 1fr; gap: 24px; margin-bottom: 24px; }
    @media (min-width: 768px) { .vb-grid { grid-template-columns: repeat(3, 1fr); } .vb-two { grid-template-columns: 1fr 1fr; } }
    @media (min-width: 1280px) { .vb-grid { grid-template-columns: repeat(4, 1fr); } }
    .vb-short { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 4px; border-radius: 16px; background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-main); font: 700 10.5px 'Manrope', sans-serif; text-align: center; line-height: 1.2; cursor: pointer; }
    .vb-short svg { color: var(--primary); }
    .vb-short.on { border-color: var(--gold); }
    .vb-card { position: relative; border-radius: 20px; overflow: hidden; aspect-ratio: 4 / 5; border: 1px solid var(--border-color); background: linear-gradient(160deg, #5B47A0, #2A2360); color: #fff; text-align: left; cursor: pointer; padding: 0; display: block; width: 100%; }
    .vb-card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .vb-card .vb-ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: rgba(255, 255, 255, .35); }
    .vb-card .vb-lab { position: absolute; left: 8px; right: 8px; bottom: 8px; padding: 9px 10px; border-radius: 14px; background: rgba(24,20,58, .78); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
    .vb-card .vb-lab small { display: block; font: 700 9.5px 'Manrope', sans-serif; letter-spacing: .06em; text-transform: uppercase; color: var(--gold); }
    .vb-card .vb-lab b { display: block; font: 700 13px 'Manrope', sans-serif; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .vb-card .vb-lab i { display: block; height: 4px; border-radius: 99px; background: rgba(255, 255, 255, .22); margin-top: 7px; overflow: hidden; }
    .vb-card .vb-lab i u { display: block; height: 100%; background: var(--gold); }
    .vb-add { border: 2px dashed var(--border-color); background: transparent; color: var(--text-muted); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; font: 700 12px 'Manrope', sans-serif; }
    .vb-ov { position: fixed; inset: 0; z-index: 8200; background: rgba(24,20,58, .62); -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px); display: flex; justify-content: center; align-items: flex-end; }
    @media (min-width: 768px) { .vb-ov { align-items: center; padding: 18px; } }
    .vb-sheet { width: 100%; max-width: 600px; max-height: 92vh; max-height: 92dvh; overflow-y: auto; background: var(--card-bg); color: var(--text-main); border: 1px solid var(--border-color); border-radius: 24px 24px 0 0; padding: 0 0 calc(18px + env(safe-area-inset-bottom, 0px)); }
    @media (min-width: 768px) { .vb-sheet { border-radius: 24px; } }
    .vb-cover { position: relative; height: 190px; background: linear-gradient(160deg, #5B47A0, #2A2360); border-radius: 24px 24px 0 0; overflow: hidden; }
    .vb-cover img { width: 100%; height: 100%; object-fit: cover; }
    .vb-cover .vb-x { position: absolute; top: 10px; right: 10px; width: 34px; height: 34px; border-radius: 50%; border: 0; background: rgba(24,20,58, .7); color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .vb-in { width: 100%; padding: 9px 12px; border-radius: 12px; border: 1px solid var(--border-color); background: transparent; color: inherit; font: 500 13px 'Manrope', sans-serif; min-width: 0; }
    .vb-btn { padding: 9px 14px; border-radius: 12px; border: 0; background: var(--primary); color: #fff; font: 700 12px 'Manrope', sans-serif; cursor: pointer; }
    .vb-btn.alt { background: transparent; color: var(--primary); border: 1px solid var(--primary); }
    @media (prefers-reduced-motion: reduce) { .vb-ov { animation: none; } }
    /* ---- Celebrações: confete, conquistas e contadores ---- */
    .cg-conf { position: fixed; inset: 0; z-index: 9700; pointer-events: none; }
    .cg-win { position: fixed; left: 50%; top: calc(12px + env(safe-area-inset-top, 0px)); transform: translate(-50%, -140%); z-index: 9800; width: min(92vw, 420px); background: var(--card-bg); color: var(--text-main); border: 1px solid var(--gold); border-radius: 20px; padding: 14px 16px; box-shadow: 0 14px 40px rgba(73, 34, 91, .45); transition: transform .45s cubic-bezier(.2, .9, .3, 1.2); }
    .cg-win.on { transform: translate(-50%, 0); }
    .cg-win b { font-family: 'Fraunces', serif; font-size: 17px; }
    .cg-win small { display: block; font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .cg-win i { display: block; height: 5px; border-radius: 99px; background: var(--primary); margin-top: 10px; transform-origin: left; animation: cgBar 3.6s linear forwards; }
    @keyframes cgBar { from { transform: scaleX(1); } to { transform: scaleX(0); } }
    .cg-chips { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
    .cg-chip { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; background: var(--card-bg); border: 1px solid var(--border-color); font: 700 13px 'Manrope', sans-serif; color: var(--text-main); }
    .cg-chip svg { color: var(--primary); }
    @media (prefers-reduced-motion: reduce) { .cg-win { transition: none; } .cg-win i { animation: none; } }
    /* ---- Captura rápida ---- */
    .qc-fab { position: fixed; right: 16px; bottom: calc(78px + env(safe-area-inset-bottom, 0px)); z-index: 8000; width: 54px; height: 54px; border-radius: 50%; border: 0; display: flex; align-items: center; justify-content: center; background: var(--primary); color: #fff; box-shadow: 0 8px 22px rgba(94, 40, 112, .4), 0 0 0 2px var(--gold); cursor: pointer; }
    .qc-fab:active { transform: scale(.94); }
    @media (min-width: 768px) { .qc-fab { right: 28px; bottom: 28px; } }
    .qc-ov { position: fixed; inset: 0; z-index: 9400; background: rgba(24,20,58, .55); -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px); display: flex; justify-content: center; align-items: flex-end; padding: 0; animation: steFadeIn .2s ease both; }
    @media (min-width: 768px) { .qc-ov { align-items: center; padding: 16px; } }
    .qc-box { width: 100%; max-width: 520px; max-height: 92vh; max-height: 92dvh; overflow-y: auto; background: var(--card-bg); color: var(--text-main); border: 1px solid var(--border-color); border-radius: 22px 22px 0 0; padding: 20px 18px calc(18px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -10px 40px rgba(0, 0, 0, .3); }
    @media (min-width: 768px) { .qc-box { border-radius: 22px; } }
    .qc-in { width: 100%; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--border-color); background: transparent; color: inherit; font: 500 14px 'Manrope', sans-serif; min-width: 0; }
    .qc-chip { padding: 7px 12px; border-radius: 999px; border: 1px solid var(--border-color); background: transparent; color: inherit; font: 700 12px 'Manrope', sans-serif; cursor: pointer; }
    .qc-chip[aria-checked="true"] { background: var(--primary); border-color: var(--primary); color: #fff; }
    .qc-toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(90px + env(safe-area-inset-bottom, 0px)); z-index: 9600; background: var(--primary); color: #fff; padding: 10px 16px; border-radius: 14px; font: 700 13px 'Manrope', sans-serif; box-shadow: 0 8px 24px rgba(0, 0, 0, .3); max-width: 90vw; }
    @media (prefers-reduced-motion: reduce) { .qc-ov { animation: none; } .qc-fab:active { transform: none; } }
    /* ---- Busca global ---- */
    .pg-ov { position: fixed; inset: 0; z-index: 9500; background: rgba(24,20,58, .55); -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px); display: flex; justify-content: center; align-items: flex-start; padding: 10vh 14px 14px; animation: steFadeIn .2s ease both; }
    .pg-box { width: 100%; max-width: 560px; max-height: 80vh; max-height: 80dvh; display: flex; flex-direction: column; background: var(--card-bg); color: var(--text-main); border: 1px solid var(--border-color); border-radius: 20px; box-shadow: 0 20px 50px rgba(0, 0, 0, .35); overflow: hidden; }
    .pg-in { width: 100%; border: 0; border-bottom: 1px solid var(--border-color); background: transparent; color: inherit; padding: 16px 18px; font: 500 16px 'Manrope', sans-serif; outline: none; }
    .pg-res { overflow-y: auto; padding: 6px 8px 12px; }
    .pg-grp { margin: 12px 10px 4px; font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); }
    .pg-row { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 9px 10px; border-radius: 12px; background: transparent; border: 0; color: inherit; cursor: pointer; }
    .pg-row:hover, .pg-row:focus-visible { background: var(--ste-soft2); outline: none; }
    .pg-row svg { color: var(--primary); flex: none; }
    .pg-t { font-size: 13.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pg-s { font-size: 11.5px; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pg-none { padding: 18px 12px; font-size: 13px; color: var(--text-muted); }
    @media (prefers-reduced-motion: reduce) { .pg-ov { animation: none; } }
    /* ---- Salmo do dia e lembretes animados ---- */
    :root { --ste-soft: #E7DBEF; --ste-soft2: #FAF5FC; --ste-ok: #3F7C55; --ste-ok-bg: #E4F1E9; }
    .dark { --ste-soft: #3F234F; --ste-soft2: #2C153A; --ste-ok: #6FBE8C; --ste-ok-bg: rgba(111,190,140,.16); }
    @keyframes steFadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes steFadeOut { from { opacity: 1; } to { opacity: 0; } }
    @keyframes steCardIn { 0% { opacity: 0; transform: translateY(30px) scale(.94); } 62% { opacity: 1; transform: translateY(-5px) scale(1.012); } 100% { opacity: 1; transform: none; } }
    @keyframes steCardOut { to { opacity: 0; transform: translateY(18px) scale(.96); } }
    @keyframes steRise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @keyframes steFloat { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-4px) rotate(-4deg); } }
    @keyframes steSweep { from { background-position: 100% 0; } to { background-position: 0% 0; } }
    @keyframes steNumPop { 0% { opacity: 0; transform: scale(.7); } 60% { opacity: 1; transform: scale(1.08); } 100% { opacity: 1; transform: scale(1); } }
    .ste-pop-ov { position: fixed; inset: 0; z-index: 9000; background: rgba(24,20,58, .6); display: flex; align-items: center; justify-content: center; padding: 18px; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); animation: steFadeIn .28s ease both; }
    .ste-pop-ov.closing { animation: steFadeOut .26s ease both; }
    .ste-pop-card { background: var(--card-bg); color: var(--text-main); border-radius: 22px; padding: 22px 20px; width: 100%; max-width: 380px; max-height: 88vh; max-height: 88dvh; overflow-y: auto; box-shadow: 0 20px 50px rgba(0, 0, 0, .35); font-family: 'Manrope', sans-serif; animation: steCardIn .6s cubic-bezier(.2, .9, .3, 1) both; }
    .ste-pop-ov.closing .ste-pop-card { animation: steCardOut .26s ease-in both; }
    .ste-pop-card > *:not(.ste-pop-rows) { animation: steRise .5s ease both; }
    .ste-pop-card > *:nth-child(1) { animation-delay: .12s; } .ste-pop-card > *:nth-child(2) { animation-delay: .18s; }
    .ste-pop-card > *:nth-child(3) { animation-delay: .24s; } .ste-pop-card > *:nth-child(4) { animation-delay: .32s; }
    .ste-pop-card > *:nth-child(5) { animation-delay: .38s; } .ste-pop-card > *:nth-child(6) { animation-delay: .44s; }
    .ste-pop-card > *:last-child { animation-delay: .8s; }
    .ste-pop-date { font-size: 12px; color: var(--text-muted); }
    .ste-pop-label { margin-top: 16px; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--gold); }
    .ste-pop-title { font-family: 'Fraunces', serif; font-size: 28px; line-height: 1.15; }
    .ste-pop-text { font-size: 14.5px; line-height: 1.5; margin-top: 8px; }
    .ste-pop-link { display: inline-block; margin-top: 10px; font-size: 12.5px; color: var(--text-muted); text-decoration: underline; }
    .ste-pop-row { display: flex; gap: 10px; align-items: baseline; padding: 6px 0; border-top: 1px solid var(--border-color); }
    .ste-pop-row b { min-width: 52px; font-size: 12.5px; color: var(--primary); }
    .ste-pop-row span { font-size: 14px; line-height: 1.35; }
    .ste-pop-empty { font-size: 13.5px; color: var(--text-muted); padding: 4px 0; }
    .ste-pop-btn { width: 100%; margin-top: 20px; border: none; border-radius: 14px; padding: 13px; background: var(--primary); color: #fff; font-weight: 700; font-size: 14px; font-family: 'Manrope', sans-serif; cursor: pointer; transition: transform .15s ease, opacity .15s ease; }
    .ste-pop-btn:active { transform: scale(.97); opacity: .9; }
    .ste-pop-rows { margin-top: 6px; }
    .ste-pop-rows > * { animation: steRise .45s ease both; }
    .ste-pop-rows > *:nth-child(1) { animation-delay: .5s; } .ste-pop-rows > *:nth-child(2) { animation-delay: .57s; }
    .ste-pop-rows > *:nth-child(3) { animation-delay: .64s; } .ste-pop-rows > *:nth-child(4) { animation-delay: .71s; }
    .ste-pop-rows > *:nth-child(5) { animation-delay: .78s; } .ste-pop-rows > *:nth-child(n+6) { animation-delay: .85s; }
    .ste-pop-pray { display: inline-block; animation: steFloat 2.6s ease-in-out .6s infinite; }
    .ste-psalm-num { display: inline-block; background: linear-gradient(100deg, var(--text-main) 34%, var(--gold) 50%, var(--text-main) 66%); background-size: 300% 100%; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; animation: steNumPop .6s cubic-bezier(.2, .9, .3, 1.2) .24s both, steSweep 1.6s ease-in-out .8s both; }
    .ste-psalm-card { cursor: pointer; transition: transform .2s ease, box-shadow .2s ease; }
    .ste-psalm-card:active { transform: scale(.985); }
    .ste-rest-pill { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 8500; display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-radius: 999px; background: #2A2360; color: #fff; box-shadow: 0 10px 28px rgba(0,0,0,.3); font-weight: 700; font-size: 14px; white-space: nowrap; animation: steFadeIn .2s ease both; }
    .ste-rest-pill.fim { background: #B8934F; }
    .ste-rest-pill button { background: rgba(255,255,255,.2); border: none; color: #fff; border-radius: 999px; padding: 4px 12px; font-size: 12px; font-weight: 700; }
    .ste-modal-ov { position: fixed; inset: 0; z-index: 9000; background: rgba(24,20,58, .6); display: flex; align-items: center; justify-content: center; padding: 14px; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); animation: steFadeIn .2s ease both; }
    .ste-modal-card { background: var(--card-bg); color: var(--text-main); border-radius: 22px; padding: 22px 20px; width: 100%; max-width: 460px; max-height: 90vh; max-height: 90dvh; overflow-y: auto; box-shadow: 0 24px 60px rgba(0,0,0,.35); }

    /* ---- Carta para Deus ---- */
    .ste-carta { position: relative; border-radius: 22px; padding: 30px 22px 24px; color: #4A3B26;

    // ---- Backup dos dados (exportar / restaurar) ----
    function backupKeys() {
      const ks = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.indexOf('ste_') === 0 && k !== 'ste_lastbackup') ks.push(k);

    }
    function backupMsg(text, ok) {
      const el = document.getElementById('backup-msg');
      if (!el) return;
      el.className = 'mt-3 text-xs font-semibold ' + (ok ? 'text-emerald-600 dark:text-emerald-400' : 'text-red-600 dark:text-red-400');
      el.textContent = text;
    }
    function exportBackup() {
      try {
        const data = {};
        backupKeys().forEach(k => { data[k] = localStorage.getItem(k); });
        const payload = { app: 'ste', version: 1, exportedAt: new Date().toISOString(), data };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'ste-backup-' + isoDay(new Date()) + '.json';
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1500);
        setStore('lastbackup', new Date().toISOString());
        renderScreen();
        backupMsg('Backup baixado. Guarde o arquivo em um lugar seguro, como o Drive ou o e-mail.', true);
      } catch (e) {
        backupMsg('Não foi possível gerar o backup neste navegador.', false);
      }
    }
    function importBackup(input) {
      const file = input.files && input.files[0];
      input.value = '';
      if (!file) return;
      if (file.size > 5 * 1024 * 1024) { backupMsg('Esse arquivo é grande demais para ser um backup do STE.', false); return; }
      const reader = new FileReader();
      reader.onerror = () => backupMsg('Não consegui abrir o arquivo. Tente de novo.', false);
      reader.onload = () => {
        let payload;
        try { payload = JSON.parse(reader.result); } catch (e) { payload = null; }
        if (!payload || payload.app !== 'ste' || !payload.data || typeof payload.data !== 'object') {
          backupMsg('Esse arquivo não parece um backup do STE. Escolha um .json baixado pelo app.', false);
          return;
        }
        const entries = Object.entries(payload.data).filter(([k, v]) => k.indexOf('ste_') === 0 && k !== 'ste_lastbackup' && typeof v === 'string');
        if (!entries.length) { backupMsg('O backup está vazio, então nada foi alterado.', false); return; }
        const d = payload.exportedAt ? new Date(payload.exportedAt) : null;
        const quando = d && !isNaN(d) ? d.toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' }) : 'data desconhecida';
        if (!confirm('Restaurar o backup de ' + quando + '? Isso substitui todos os dados atuais deste navegador.')) return;
        const antes = {};
        backupKeys().forEach(k => { antes[k] = localStorage.getItem(k); });
        const total = entries.reduce((a, e) => a + e[0].length + e[1].length, 0);
        let falhou = '';
        try {
          const novas = new Set(entries.map(e => e[0]));
          backupKeys().forEach(k => { if (!novas.has(k)) localStorage.removeItem(k); });
          entries.slice().sort((a, b) => a[1].length - b[1].length).forEach(([k, v]) => { falhou = k; localStorage.setItem(k, v); });
        } catch (e) {
          try {
            entries.forEach(([k]) => { if (!(k in antes)) localStorage.removeItem(k); });
            Object.keys(antes).forEach(k => localStorage.setItem(k, antes[k]));
          } catch (e2) {}
          const nome = (e && e.name) || 'erro desconhecido', cota = /quota/i.test(nome) || (e && (e.code === 22 || e.code === 1014));
          const mb = (total / 1048576).toFixed(1).replace('.', ',');
          backupMsg('O navegador recusou os dados (' + nome + (falhou ? ' em "' + falhou.replace('ste_', '') + '"' : '') + '). O backup tem cerca de ' + mb + ' MB de texto. Mantive os dados atuais. ' + (cota ? 'Este navegador guarda por volta de 5 MB por site: no aparelho de origem, apague fotos grandes do Dream Board (veja a lista de espaço usado acima) e baixe o backup de novo.' : 'Se você abriu o arquivo pelo app Arquivos, abra o STE pelo endereço do site ou pelo ícone da tela de início e tente de novo.'), false);
          return;
        }
        location.reload();
      };
      reader.readAsText(file);
    }

    // ---- Progresso: histórico diário (água, passos, peso) e sequência dos hábitos ----
    // Metas diárias (editáveis na aba Saúde). Sem valor salvo, valem 8 copos e 10.000 passos.
    function waterGoal() { return Math.min(30, Math.max(1, parseInt(healthData.waterGoal, 10) || 8)); }
    function stepsGoal() { return Math.min(100000, Math.max(1000, parseInt(healthData.stepsGoal, 10) || 10000)); }
    function fmtPassos(n) { return Number(n || 0).toLocaleString('pt-BR'); }
    function parseWeight(v) { return parseFloat(String(v == null ? '' : v).replace(',', '.')); }
    function lastDays(n) {
      const out = [], now = new Date();
      for (let i = n - 1; i >= 0; i--) out.push(isoDay(new Date(now.getFullYear(), now.getMonth(), now.getDate() - i)));
      return out;
    }
    let dayLog = getStore('daylog', {});
    if (!dayLog || typeof dayLog !== 'object' || Array.isArray(dayLog)) dayLog = {};
    function logDay(key, patch) {
      dayLog[key] = Object.assign({}, dayLog[key], patch);
      setStore('daylog', dayLog);
    }
    // Contadores diários passam a ter data; ao virar o dia, o valor de ontem vai para o histórico.
    function rolloverDay() {
      const hoje = isoDay(new Date());
      if (!counters.date) { counters.date = hoje; setStore('counters', counters); return false; }
      if (counters.date === hoje) return false;
      logDay(counters.date, { water: counters.water || 0, steps: counters.steps || 0 });
      counters = Object.assign({}, counters, { water: 0, steps: 0, date: hoje });
      setStore('counters', counters);
      return true;
    }
    // Primeiro uso: guarda o peso atual como primeiro ponto do gráfico.
    if (!Object.values(dayLog).some(d => d && d.weight != null)) {
      const w0 = parseWeight(healthData.weight);
      if (w0 > 0) logDay(isoDay(new Date()), { weight: w0 });
    }

    // Hábitos: cada dia feito fica registrado; a sequência é calculada a partir do histórico.
    let habitLog = getStore('habitlog', null);
    if (!habitLog || typeof habitLog !== 'object' || Array.isArray(habitLog)) {
      // Migração: recria os dias que sustentam a sequência que você já tinha.
      habitLog = {};
      const now0 = new Date();
      habits.forEach(h => {
        const n = Math.min(90, Math.max(0, parseInt(h.streak, 10) || 0));
        const start = h.done ? 0 : 1;
        for (let i = start; i < start + n; i++) {
          const k = isoDay(new Date(now0.getFullYear(), now0.getMonth(), now0.getDate() - i));
          (habitLog[k] = habitLog[k] || []).push(h.id);
        }
      });
      setStore('habitlog', habitLog);
    }
    function habitDoneOn(id, key) { return !!(habitLog[key] && habitLog[key].includes(id)); }
    function habitStreak(id) {
      const now = new Date();
      let i = habitDoneOn(id, isoDay(now)) ? 0 : 1, n = 0;
      while (i < 400 && habitDoneOn(id, isoDay(new Date(now.getFullYear(), now.getMonth(), now.getDate() - i)))) { n++; i++; }
      return n;
    }
    function habitBest(id) {
      let best = 0, run = 0;
      lastDays(90).forEach(k => { if (habitDoneOn(id, k)) { run++; if (run > best) best = run; } else run = 0; });
      return best;
    }
    function syncHabits() {
      const hoje = isoDay(new Date());
      let changed = false;
      habits = habits.map(h => {
        const done = habitDoneOn(h.id, hoje), streak = habitStreak(h.id);
        if (h.done === done && h.streak === streak) return h;
        changed = true;
        return Object.assign({}, h, { done, streak });
      });
      if (changed) setStore('habitos', habits);
    }

    // ---- Resumo do ano ----
    function finShiftYear(d) {
      const alvo = new Date().getFullYear() + finYearOff + d;

      renderScreen();
    }
    function finYearSummaryHtml() {
      const ano = new Date().getFullYear() + finYearOff, hoje = isoDay(new Date()), ehAtual = finYearOff === 0;
      const meses = Array.from({ length: 12 }, (_, i) => ano + '-' + pad2(i + 1)).filter(mk => mk <= hoje.slice(0, 7));
      if (!meses.length) return '';
      const byCatAno = {};
      let totalIn = 0, totalOut = 0, pior = null;
      meses.forEach(mk => {
        const txs = finTx.filter(t => t.date.slice(0, 7) === mk);
        const inc = txs.filter(t => t.type === 'in').reduce((s, t) => s + t.amount, 0);
        const out = txs.filter(t => t.type === 'out').reduce((s, t) => s + t.amount, 0);
        totalIn += inc; totalOut += out;
        if (!pior || out > pior.out) pior = { mk, out };
        txs.filter(t => t.type === 'out').forEach(t => { byCatAno[t.cat] = (byCatAno[t.cat] || 0) + t.amount; });
      });
      const economizado = totalIn - totalOut;
      const catsAno = Object.entries(byCatAno).sort((a, b) => b[1] - a[1]);
      const btn = 'w-9 h-9 rounded-lg border border-[#EFE1F5] dark:border-[#3D224D] bg-[#FAF5FC] dark:bg-[#2C153A] font-bold text-sm';
      const tile = (rotulo, grande, sub) => '<div class="p-3 rounded-xl bg-[#FAF5FC] dark:bg-[#2C153A] border border-[#EFE1F5] dark:border-[#3D224D]"><p class="text-[10px] font-bold uppercase text-[#8B7D95]">' + rotulo + '</p><p class="font-serif-display text-lg font-bold mt-1">' + grande + '</p>' + (sub ? '<p class="text-[11px] text-[#8B7D95] dark:text-[#C1B1CB] mt-0.5">' + sub + '</p>' : '') + '</div>';
      const tiles = tile('Economizado no ano', fmtBRL(economizado), meses.length + (meses.length === 1 ? ' mês' : ' meses')) +
        tile('Mês com mais gasto', pior ? finMonthLabel(pior.mk).split(' de ')[0] : '—', pior ? fmtBRL(pior.out) : '') +
        tile('Categoria que mais pesou', catsAno.length ? catsAno[0][0] : '—', catsAno.length ? fmtBRL(catsAno[0][1]) + ' no ano' : '');
      return `          <div class="custom-card rounded-2xl p-6 mb-6">
            <div class="flex items-center justify-between mb-4">
              <button onclick="finShiftYear(-1)" aria-label="Ano anterior" class="${btn}">‹</button>
              <h2 class="font-serif-display text-xl font-bold">Resumo de ${ano}</h2>
              <button onclick="finShiftYear(1)" aria-label="Próximo ano" ${ehAtual ? 'disabled' : ''} class="${btn} ${ehAtual ? 'opacity-40' : ''}">›</button>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-3">${tiles}</div>
          </div>
`;

        criadas++;
      });
      setStore('finances', finances);

      ensureRecurringFinTx();
      renderScreen();

      const bw = (W - padL - padR) / 7, resumo = keys.map((k, i) => weekdayShort(k) + ' ' + fmtH(vals[i]) + ' h').join(', ');

      keys.forEach((k, i) => {

      eduData.subjects.forEach(s => s.grades.forEach(g => { if (g.date && g.date.slice(0, 7) === mk) notas.push(g.value); }));

      const feitas = eduData.exams.filter(x => x.doneOn && x.doneOn.slice(0, 7) === mk).length;
      const tile = (rotulo, grande, sub) => '<div class="p-3 rounded-xl bg-[#FAF5FC] dark:bg-[#2C153A] border border-[#EFE1F5] dark:border-[#3D224D]"><p class="text-[10px] font-bold uppercase text-[#8B7D95]">' + rotulo + '</p><p class="font-serif-display text-2xl font-bold mt-1">' + grande + '</p><p class="text-[11px] text-[#8B7D95] dark:text-[#C1B1CB] mt-0.5">' + sub + '</p></div>';

        tile('Provas e entregas feitas', feitas, 'neste mês') +
        tile('Notas lançadas', notas.length, notas.length ? 'média ' + fmtNota(mediaNotas) : 'nenhuma este mês');
      const faixa = keys.map(k => {
        const cls = k > hoje ? 'border border-[#EFE1F5] dark:border-[#3D224D]' : eduDayMinutes(k) > 0 ? 'bg-[#A56ABD]' : 'bg-[#E7DBEF] dark:bg-[#3D224D]';
        return '<span title="' + fmtDM(k) + '" class="w-3 h-3 rounded-sm ' + cls + '"></span>';
      }).join('');
      const rotuloMes = new Date(partes[0], partes[1] - 1, 1).toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
      const btn = 'w-9 h-9 rounded-lg border border-[#EFE1F5] dark:border-[#3D224D] bg-[#FAF5FC] dark:bg-[#2C153A] font-bold text-sm';
      return `          <div class="md:col-span-2 custom-card rounded-2xl p-6">
            <div class="flex items-center justify-between mb-4">
              <button onclick="shiftEduMonth(-1)" aria-label="Mês anterior" class="${btn}">‹</button>
              <div class="text-center"><h2 class="font-serif-display text-xl font-bold">Resumo do mês</h2><p class="text-xs text-[#8B7D95] dark:text-[#C1B1CB] capitalize">${rotuloMes}</p></div>
              <button onclick="shiftEduMonth(1)" aria-label="Próximo mês" ${ehAtual ? 'disabled' : ''} class="${btn} ${ehAtual ? 'opacity-40' : ''}">›</button>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-3">${tiles}</div>
            <p class="text-[10px] font-bold uppercase text-[#8B7D95] mt-4 mb-1">Dias com estudo</p>
            <div class="flex flex-wrap gap-1" role="img" aria-label="Dias com estudo em ${rotuloMes}">${faixa}</div>
            <p class="text-[10px] text-[#8B7D95] mt-1.5">Notas lançadas antes desta versão não têm data e não entram na conta do mês.</p>
          </div>
`;
    }

    // ---- Modelos de rotina ----
    const EDU_TEMPLATES = {
      concurso: { label: 'Concurso público', subjects: [
        ['Português', 'grades'], ['Matemática', 'grades'], ['Direito Constitucional', 'grades'], ['Direito Administrativo', 'grades'], ['Informática', 'grades'], ['Atualidades', 'grades']
      ] },
      faculdade: { label: 'Faculdade (grade do semestre)', subjects: [
        ['Cálculo I', 'grades'], ['Física I', 'grades'], ['Programação I', 'grades'], ['Trabalho de Conclusão', 'progress']
      ] },
      idioma: { label: 'Idioma novo', subjects: [
        ['Inglês', 'progress']
      ] },
      curso: { label: 'Curso online', subjects: [
        ['Curso online', 'progress']
      ] }
    };
    function useEduTemplate(key) {
      const tpl = EDU_TEMPLATES[key];
      if (!tpl) return;
      if (eduData.subjects.length && !confirm('Adicionar as matérias do modelo "' + tpl.label + '"? Suas matérias atuais continuam.')) return;
      const base = Date.now(), nomes = new Set(eduData.subjects.map(s => s.name.toLowerCase()));
      tpl.subjects.forEach((sub, i) => {
        let name = sub[0], n = 2;
        while (nomes.has(name.toLowerCase())) { name = sub[0] + ' (' + n + ')'; n++; }
        nomes.add(name.toLowerCase());
        eduData.subjects.push({ id: base + i, name, type: sub[1], grades: [], progress: { mode: 'percent', pct: 0, done: 0, total: 0 } });
      });
      saveEdu();
      renderScreen();
    }
    function renderEstudos(container) {
      container.innerHTML = `
        <header class="mb-6">

          <h1 class="font-serif-display text-3xl font-bold">Estudos & Carreira</h1>
          <p class="text-xs md:text-sm text-[#8B7D95] dark:text-[#C1B1CB]">Matérias, notas, horas de estudo e ideias de conteúdo</p>
        </header>

        ${eduTabsHtml()}
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="dx-pane" ${eduTab !== 'estudo' ? 'hidden' : ''}>
          ${studyTimeCardHtml()}
          <div class="custom-card rounded-2xl p-6">
            <h2 class="font-serif-display text-xl font-bold mb-4">Matérias & Cursos</h2>
            <div class="space-y-3">${eduData.subjects.map(subjectCardHtml).join('') || '<p class="text-xs text-[#8B7D95] dark:text-[#C1B1CB]">Nenhuma matéria ainda.</p>'}</div>
            <div class="flex gap-2 mt-4">
              <input type="text" id="sub-new-name" maxlength="60" aria-label="Nome da nova matéria ou curso" placeholder="Ex.: Inglês ou Cálculo I" onkeydown="if (event.key === 'Enter') newSubject()" class="flex-1 px-3 py-2 rounded-xl border border-[#EFE1F5] dark:border-[#3D224D] bg-[#FAF5FC] dark:bg-[#2C153A] text-xs">
              <button onclick="newSubject()" class="px-4 py-2 bg-[#A56ABD] text-white font-bold text-xs rounded-xl">+ Criar</button>
            </div>
            <p id="sub-msg" aria-live="polite" class="text-[11px] font-semibold text-red-600 dark:text-red-400 mt-2"></p>
          </div>
          ${examsCardHtml()}
          <div class="custom-card rounded-2xl p-6">
            <h3 class="font-serif-display text-xl font-bold mb-3">Modelos de rotina</h3>
            <p class="text-xs text-[#8B7D95] dark:text-[#C1B1CB] mb-3">Cria matérias de exemplo para você editar, sem apagar as que já existem.</p>
            <div class="flex flex-col gap-2">${Object.keys(EDU_TEMPLATES).map(k => '<button onclick="useEduTemplate(\'' + k + '\')" class="px-3 py-2 rounded-xl border border-[#A56ABD] text-[#A56ABD] text-xs font-bold text-left">' + esc(EDU_TEMPLATES[k].label) + '</button>').join('')}</div>
          </div>

          </div>
          <div class="dx-pane" ${eduTab !== 'diario' ? 'hidden' : ''}>
          ${eduDiaryCardHtml()}
          ${eduMonthSummaryHtml()}
          ${eduDreamsCardHtml()}
          </div>
          <div class="dx-pane" ${eduTab !== 'ideias' ? 'hidden' : ''}>
          ${ideasCardHtml()}
          </div>
        </div>
      `;
    }


    // ================= Sonhos & Fé =================
    const DREAM_CATS = ['Amor', 'Saúde', 'Casa', 'Viagem', 'Prosperidade', 'Carreira', 'Fé', 'Desenvolvimento pessoal', 'Compras', 'Estudos', 'Família', 'Outro'];
    const DREAM_LBL = { 'Saúde': 'Saúde e bem-estar', 'Casa': 'Meu lar', 'Viagem': 'Viagens' };
    function dreamLbl(c) { return DREAM_LBL[c] || c; }
    let sonhosData = getStore('sonhosfe', null);
    if (!sonhosData || typeof sonhosData !== 'object' || !Array.isArray(sonhosData.items)) {
      sonhosData = {
        items: [],
        letter: { text: 'Confie no processo, dê um passo de cada vez e seja paciente com a sua evolução. Você é capaz de realizar coisas grandiosas!', written: '', openOn: '' },
        psalmRead: {}
      };
      setStore('sonhosfe', sonhosData);
    }
    if (!sonhosData.letter || typeof sonhosData.letter !== 'object') sonhosData.letter = { text: '', written: '', openOn: '' };
    if (!sonhosData.psalmRead || typeof sonhosData.psalmRead !== 'object') sonhosData.psalmRead = {};
    if (!sonhosData.gratitude || typeof sonhosData.gratitude !== 'object' || Array.isArray(sonhosData.gratitude)) sonhosData.gratitude = {};
    if (!Array.isArray(sonhosData.prayers)) sonhosData.prayers = [];
    if (!Array.isArray(sonhosData.notes)) sonhosData.notes = [];
    let dreamEditId = null;
    function saveSonhos() { if (!setStoreChecked('sonhosfe', sonhosData)) alert('Não foi possível salvar: o armazenamento do aparelho está cheio. Baixe um backup e remova fotos antigas.'); }

    // ---- Mural de sonhos ----
    function dreamWhen(date) {
      if (!date) return '';
      const d = daysBetween(isoDay(new Date()), date);
      return 'Meta: ' + fmtDMY(date) + (d === 0 ? ' (hoje)' : d > 0 ? ' (' + fmtWhen(d) + ')' : ' (passou ' + fmtWhen(d) + ')');
    }
    function addDream() {
      const g = id => { const e = document.getElementById(id); return e ? e.value : ''; }, msg = document.getElementById('dream-msg');
      const title = g('dream-title').trim().slice(0, 80), cat = DREAM_CATS.includes(g('dream-cat')) ? g('dream-cat') : 'Outro', date = g('dream-date'), desc = g('dream-desc').trim().slice(0, 400);
      if (msg) msg.textContent = '';
      if (!title) { if (msg) msg.textContent = 'Escreva o sonho.'; return; }
      if (date && !validIsoDate(date)) { if (msg) msg.textContent = 'Escolha uma data válida ou deixe em branco.'; return; }
      let novoId = null;
      if (dreamEditId != null) {
        sonhosData.items = sonhosData.items.map(it => it.id === dreamEditId ? Object.assign({}, it, { title, cat, date, desc }, vbFormImg !== undefined ? { img: vbFormImg || '' } : {}) : it);
        dreamEditId = null;
      } else {
        novoId = Date.now();
        sonhosData.items = sonhosData.items.concat({ id: novoId, cat, title, date, desc, img: vbFormImg || '', steps: [], goal: 0, saved: 0, doneOn: '' });
      }
      vbFormImg = undefined; vbPanel = '';
      saveSonhos();
      renderScreen();
      if (novoId) openCoach(novoId);
    }
    function editDream(id) {
      dreamEditId = id; vbFormImg = undefined; vbPanel = 'novo'; vbOpenId = null;
      renderScreen();
      const el = document.getElementById('vb-panel');
      if (el) el.scrollIntoView({ behavior: steScroll(), block: 'start' });
    }
    function cancelDream() { dreamEditId = null; vbFormImg = undefined; vbPanel = ''; renderScreen(); }
    function deleteDream(id) {
      const it = sonhosData.items.find(x => x.id === id);
      if (!it || !confirm('Remover "' + it.title + '" do mural?')) return;
      sonhosData.items = sonhosData.items.filter(x => x.id !== id);
      if (dreamEditId === id) dreamEditId = null;
      if (vbOpenId === id) vbOpenId = null;
      saveSonhos();
      renderScreen();
    }

    // ---- Carta para o futuro ----

    // ---- Salmo do dia ----
    function togglePsalmRead() {
      const n = dailyState && dailyState.psalm, hoje = isoDay(new Date());
      if (!n) return;
      if (sonhosData.psalmRead[hoje] === n) delete sonhosData.psalmRead[hoje]; else sonhosData.psalmRead[hoje] = n;
      saveSonhos();
      renderScreen();
    }
    function psalmCardHtml() {
      const n = dailyState && dailyState.psalm, hoje = isoDay(new Date());
      if (!n) return '';
      const lido = sonhosData.psalmRead[hoje] === n, total = Object.keys(sonhosData.psalmRead).length;
      return `          <div class="md:col-span-2 custom-card rounded-2xl p-6 border-l-4 border-[#C6A467]">
            <p class="text-xs uppercase font-bold tracking-wider text-[#C6A467] mb-1">${ico('bible', 14, 'mr-1.5')}Salmo do Dia · Salmo ${n}</p>
            <p class="font-serif-display text-base md:text-lg italic text-[#2A1730] dark:text-[#F7EDFB]">${esc(PSALM_THEMES[n - 1])}</p>
            <div class="flex flex-wrap items-center gap-3 mt-3">
              <a href="https://www.bibliaonline.com.br/acf/sl/${n}" target="_blank" rel="noopener" class="text-xs font-semibold text-[#A56ABD] underline">Ler o Salmo ${n} completo</a>
              <button onclick="togglePsalmRead()" aria-pressed="${lido}" class="px-3 py-1.5 rounded-lg border text-xs font-bold ${lido ? 'border-[#A56ABD] bg-[#A56ABD] text-white' : 'border-[#A56ABD] text-[#A56ABD]'}">${lido ? ico('check', 12, 'mr-1 -mt-0.5', 2.8) + 'Lido hoje' : 'Marcar como lido'}</button>
            </div>
            <p class="text-[11px] text-[#8B7D95] dark:text-[#C1B1CB] mt-2">${total ? total + (total === 1 ? ' dia com salmo lido' : ' dias com salmo lido') : 'Nenhum salmo marcado como lido ainda'}${lido ? '. Toque de novo em "Lido hoje" para desfazer.' : '.'}</p>
          </div>
`;
    }

    // ---- Passos, valor guardado e sonhos realizados ----
    let dreamOpen = {}, dreamDoneOpen = false;
    function dreamSteps(it) { return Array.isArray(it.steps) ? it.steps : []; }
    function fmtBRL(n) { return Number(n || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }
    function fmtNum(n) { return Number(n || 0).toLocaleString('pt-BR', { maximumFractionDigits: 2 }); }
    function parseMoney(v) {
      let t = String(v == null ? '' : v).replace(/R\$/i, '').replace(/\s/g, '');
      if (t === '') return 0;
      if (t.includes(',')) t = t.replace(/\./g, '').replace(',', '.');
      else if (/^\d{1,3}(\.\d{3})+$/.test(t)) t = t.replace(/\./g, '');
      return /^\d+(\.\d{1,2})?$/.test(t) ? parseFloat(t) : NaN;
    }
    function updateDream(id, patch) {
      sonhosData.items = sonhosData.items.map(it => it.id === id ? Object.assign({}, it, typeof patch === 'function' ? patch(it) : patch) : it);
      saveSonhos();
    }
    function toggleDreamOpen(id) { dreamOpen[id] = !dreamOpen[id]; renderScreen(); }
    function toggleDoneList() { dreamDoneOpen = !dreamDoneOpen; renderScreen(); }
    function addStep(id) {
      const input = document.getElementById('step-new-' + id), msg = document.getElementById('dream-msg-' + id);
      const text = input ? input.value.trim().slice(0, 80) : '';
      if (msg) msg.textContent = '';
      if (!text) { if (msg) msg.textContent = 'Escreva o passo.'; return; }
      const dueEl = document.getElementById('step-due-' + id), due = dueEl && validIsoDate(dueEl.value) ? dueEl.value : '';
      updateDream(id, it => ({ steps: dreamSteps(it).concat({ id: Date.now(), text, done: false, due }) }));
      dreamOpen[id] = true;
      renderScreen();
    }
    function deleteStep(id, sid) { updateDream(id, it => ({ steps: dreamSteps(it).filter(st => st.id !== sid) })); renderScreen(); }
    function saveDreamMoney(id, field, val) {
      const msg = document.getElementById('dream-msg-' + id), n = parseMoney(val);
      if (msg) msg.textContent = '';
      if (isNaN(n) || n > 1e9) { if (msg) msg.textContent = (field === 'goal' ? 'Meta' : 'Valor guardado') + ': use só números, como 1.500,50.'; return; }
      updateDream(id, { [field]: n });
      dreamOpen[id] = true;
      renderScreen();
    }
    function addSaved(id) {
      const input = document.getElementById('saved-add-' + id), msg = document.getElementById('dream-msg-' + id), n = parseMoney(input ? input.value : '');
      if (msg) msg.textContent = '';
      if (isNaN(n) || n <= 0 || n > 1e9) { if (msg) msg.textContent = 'Digite o valor que você guardou, como 200 ou 150,50.'; return; }
      updateDream(id, it => ({ saved: Math.round(((Number(it.saved) || 0) + n) * 100) / 100 }));
      dreamOpen[id] = true;
      renderScreen();
    }
    function reopenDream(id) { updateDream(id, { doneOn: '' }); renderScreen(); }
    function dreamBarHtml(rotulo, direita, pct) {
      return '<div class="mt-2"><div class="flex justify-between text-[11px] text-[#8B7D95] dark:text-[#C1B1CB] mb-1"><span>' + rotulo + '</span><span>' + direita + '</span></div>' +
        '<div class="w-full bg-[#E7DBEF] dark:bg-[#3D224D] h-2 rounded-full overflow-hidden" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + Math.round(pct) + '" aria-label="' + rotulo + '">' +
        '<div class="' + (pct >= 100 ? 'bg-[#C6A467]' : 'bg-[#A56ABD]') + ' h-full" style="width:' + Math.min(100, pct) + '%"></div></div></div>';
    }
    function dreamItemHtml(it) {

      const goal = Number(it.goal) || 0, saved = Number(it.saved) || 0;
      const resumo = dreamBarsHtml(it);
      const passos = steps.map(st => `
                  <div class="flex items-center justify-between gap-2 py-1">

                      <span class="w-4 h-4 shrink-0 rounded-full border border-[#A56ABD] flex items-center justify-center ${st.done ? 'bg-[#A56ABD] text-white' : ''}">${st.done ? ico('check', 9, '', 3) : ''}</span>
                      <span class="text-xs ${st.done ? 'line-through text-[#8B7D95]' : ''}">${esc(st.text)}${st.due ? ' <span class="text-[10px] font-bold ' + (!st.done && st.due < isoDay(new Date()) ? 'text-red-500' : 'text-[#C6A467]') + '">· ' + fmtDMY(st.due) + '</span>' : ''}</span>

                  </div>`).join('');
      const detalhes = `
              <div class="mt-3 pt-3 border-t border-[#EFE1F5] dark:border-[#3D224D]">
                <p class="text-[10px] font-bold uppercase text-[#8B7D95] mb-1">Passos</p>
                ${passos || '<p class="text-[11px] text-[#8B7D95] dark:text-[#C1B1CB]">Nenhum passo ainda. Quebre o sonho em etapas pequenas.</p>'}
                <div class="flex gap-2 mt-2">
                  <input type="text" id="step-new-${it.id}" maxlength="80" aria-label="Novo passo" placeholder="Ex.: Tirar o passaporte" onkeydown="if (event.key === 'Enter') addStep(${it.id})" class="flex-1 min-w-0 px-3 py-2 rounded-xl border border-[#EFE1F5] dark:border-[#3D224D] bg-[#FAF5FC] dark:bg-[#2C153A] text-xs">
                  <input type="date" id="step-due-${it.id}" aria-label="Prazo do passo, opcional" class="w-[8.5rem] px-2 py-2 rounded-xl border border-[#EFE1F5] dark:border-[#3D224D] bg-white dark:bg-[#200B2B] text-xs"><button onclick="addStep(${it.id})" class="px-3 py-2 bg-[#A56ABD] text-white font-bold text-xs rounded-xl">+ Passo</button>
                </div>
                <p class="text-[10px] font-bold uppercase text-[#8B7D95] mt-4 mb-1">Valor, opcional</p>
                <div class="flex flex-wrap gap-x-4 gap-y-2">
                  <label class="flex items-center gap-1.5 text-[11px] text-[#8B7D95]">Meta (R$) <input type="text" inputmode="decimal" id="dream-goal-${it.id}" value="${goal ? fmtNum(goal) : ''}" onchange="saveDreamMoney(${it.id}, 'goal', this.value)" class="w-24 px-2 py-1.5 rounded-lg border border-[#EFE1F5] dark:border-[#3D224D] bg-white dark:bg-[#200B2B] text-xs font-bold"></label>
                  <label class="flex items-center gap-1.5 text-[11px] text-[#8B7D95]">Guardado (R$) <input type="text" inputmode="decimal" id="dream-saved-${it.id}" value="${saved ? fmtNum(saved) : ''}" onchange="saveDreamMoney(${it.id}, 'saved', this.value)" class="w-24 px-2 py-1.5 rounded-lg border border-[#EFE1F5] dark:border-[#3D224D] bg-white dark:bg-[#200B2B] text-xs font-bold"></label>
                </div>
                <div class="flex gap-2 mt-2">
                  <input type="text" inputmode="decimal" id="saved-add-${it.id}" aria-label="Valor guardado agora, em reais" placeholder="Guardei agora (R$)" onkeydown="if (event.key === 'Enter') addSaved(${it.id})" class="flex-1 min-w-0 px-3 py-2 rounded-xl border border-[#EFE1F5] dark:border-[#3D224D] bg-[#FAF5FC] dark:bg-[#2C153A] text-xs">
                  <button onclick="addSaved(${it.id})" class="px-3 py-2 border border-[#A56ABD] text-[#A56ABD] font-bold text-xs rounded-xl">+ Somar</button>
                </div>
                <p id="dream-msg-${it.id}" aria-live="polite" class="text-[11px] font-semibold text-red-600 dark:text-red-400 mt-1"></p>
              </div>`;
      return `
              <div id="dream-${it.id}" class="p-3.5 rounded-xl border border-[#EFE1F5] dark:border-[#3D224D]">
                <div class="flex items-start justify-between gap-3">
                  <div class="min-w-0">
                    <span class="text-[10px] font-bold text-[#C6A467] uppercase">${esc(it.cat)}</span>
                    <p class="text-xs font-bold mt-0.5">${esc(it.title)}</p>
                    ${it.date ? '<p class="text-[11px] text-[#8B7D95] dark:text-[#C1B1CB] mt-0.5">' + dreamWhen(it.date) + '</p>' : ''}
                  </div>
                  <div class="flex gap-3 shrink-0 text-[11px] font-semibold">
                    <button onclick="editDream(${it.id})" aria-label="Editar ${esc(it.title)}" class="text-[#A56ABD] underline">Editar</button>
                    <button onclick="deleteDream(${it.id})" aria-label="Remover ${esc(it.title)}" class="text-[#8B7D95] hover:text-red-500 underline">Remover</button>
                  </div>
                </div>
                ${resumo}
                <div class="flex flex-wrap items-center gap-3 mt-3">
                  <button onclick="openCoach(${it.id})" class="px-3 py-1 rounded-lg bg-[#A56ABD] text-white text-[11px] font-bold">Me ajude com este sonho</button>
                  <button onclick="toggleDreamOpen(${it.id})" aria-expanded="${aberto}" class="text-[11px] font-semibold text-[#A56ABD] underline">${aberto ? 'Ocultar passos e valor' : 'Passos e valor'}</button>
                  <button onclick="completeDream(${it.id})" class="px-3 py-1 rounded-lg border border-[#C6A467] text-[#C6A467] text-[11px] font-bold">Marcar como realizado</button>
                </div>
                ${completingId === it.id ? completePanelHtml(it) : ''}
                ${aberto ? detalhes : ''}
              </div>`;
    }
    function dreamFormHtml() {
      const editando = dreamEditId != null ? sonhosData.items.find(x => x.id === dreamEditId) : null;

    function setEventField(id, field, val) {

    function eventOccursOn(e, day) {
      if (e.date === day) return true;
      if (!e.recur || day < e.date) return false;
      if (e.recur === 'weekly') return daysBetween(e.date, day) % 7 === 0;
      if (e.recur === 'monthly') return new Date(e.date + 'T00:00:00').getDate() === new Date(day + 'T00:00:00').getDate();
      return false;
    }
    function eventsForDay(day) { return events.filter(e => eventOccursOn(e, day)).sort((a, b) => (a.time || '').localeCompare(b.time || '')); }
    function externalForDay(day) {
      const out = [];

      dcForDay(day).forEach(x => out.push(x));

    // ================= Pessoas & Datas: aniversários, contatos e contadores de datas =================
    const PD_MESES = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
    let pdData = getStore('pessoas', null);
    if (!pdData || typeof pdData !== 'object' || Array.isArray(pdData)) pdData = {};
    if (!Array.isArray(pdData.people)) pdData.people = [];
    if (!Array.isArray(pdData.dates)) pdData.dates = [];
    function pdSave() { setStore('pessoas', pdData); }
    function pdMD(m, d) { return pad2(m) + '-' + pad2(d); }
    function pdValidMD(m, d) { return m >= 1 && m <= 12 && d >= 1 && d <= new Date(2024, m, 0).getDate(); }
    // dias até a próxima ocorrência de um mês-dia (0 = hoje) e o ano em que cai
    function pdNext(md, hoje) {
      const y = +hoje.slice(0, 4), m = +md.slice(0, 2), d = +md.slice(3, 5);
      let t = y + '-' + md;
      if (t < hoje) t = (y + 1) + '-' + md;
      if (md === '02-29' && !pdValidDay(t)) { t = (+t.slice(0, 4)) + '-02-28'; }
      return { days: daysBetween(hoje, t), year: +t.slice(0, 4), iso: t };
    }
    function pdValidDay(iso) { const p = iso.split('-').map(Number), dt = new Date(p[0], p[1] - 1, p[2]); return dt.getMonth() === p[1] - 1; }
    // lista unificada de ocorrências (aniversários + datas anuais) para um dia
    function pdForDay(day) {
      const md = day.slice(5), out = [];
      pdData.people.forEach(p => {
        if (!p.bm || pdMD(p.bm, p.bd) !== md) return;
        const age = p.by ? (+day.slice(0, 4) - p.by) : null;
        out.push({ id: 'b' + p.id, icon: 'sparkles', title: 'Aniversário de ' + p.name, sub: age && age > 0 ? 'Faz ' + age + ' anos' : 'Aniversário', tab: 'pessoas', person: p });
      });
      pdData.dates.forEach(x => {
        const hit = x.yearly ? (x.date.slice(5) === md && day >= x.date) : x.date === day;
        if (!hit) return;
        const yrs = +day.slice(0, 4) - +x.date.slice(0, 4);
        out.push({ id: 'd' + x.id, icon: 'sparkles', title: x.title, sub: x.yearly && yrs > 0 ? yrs + (yrs === 1 ? ' ano' : ' anos') : 'Data especial', tab: 'pessoas' });
      });
      return out;
    }
    function pdUpcoming(limit) {
      const hoje = isoDay(new Date()), out = [];
      pdData.people.forEach(p => { if (!p.bm) return; const n = pdNext(pdMD(p.bm, p.bd), hoje);
        out.push({ days: n.days, title: p.name, sub: 'Aniversário' + (p.by ? ' · faz ' + (n.year - p.by) + ' anos' : ''), key: 'b' + p.id }); });
      pdData.dates.forEach(x => {
        if (x.yearly) { const n = pdNext(x.date.slice(5), hoje); out.push({ days: n.days, title: x.title, sub: 'Data anual' + (n.year > +x.date.slice(0, 4) ? ' · ' + (n.year - +x.date.slice(0, 4)) + ' anos' : ''), key: 'd' + x.id }); }
        else if (x.date >= hoje) out.push({ days: daysBetween(hoje, x.date), title: x.title, sub: 'Contagem regressiva', key: 'd' + x.id });
      });
      return out.sort((a, b) => a.days - b.days).slice(0, limit || 6);
    }
    function pdFalta(n) { return n === 0 ? 'hoje' : n === 1 ? 'amanhã' : 'em ' + n + ' dias'; }
    function pdDesde(iso) {
      const hoje = isoDay(new Date()), n = daysBetween(iso, hoje);
      if (n < 0) return null;
      const a = iso.split('-').map(Number), b = hoje.split('-').map(Number);
      let m = (b[0] - a[0]) * 12 + (b[1] - a[1]); if (b[2] < a[2]) m--;
      return { dias: n, anos: Math.floor(m / 12), meses: m % 12 };
    }
    function pdAddPerson() {

      if ((bd || bm) && !pdValidMD(bm, bd)) { if (msg) msg.textContent = 'Dia e mês do aniversário não combinam.'; return; }
      if (by && (by < 1900 || by > +isoDay(new Date()).slice(0, 4))) { if (msg) msg.textContent = 'Ano inválido.'; return; }
      pdData.people.push({ id: Date.now(), name, rel: g('pd-rel').slice(0, 40), phone: g('pd-phone').slice(0, 30), note: g('pd-note').slice(0, 200), bd: bd || 0, bm: bm || 0, by: by || 0 });

    function pdReminders(now) {

      return out;
    }

    function renderPessoas(container) {
      const inCls = 'px-3 py-2 rounded-lg border border-[#EFE1F5] dark:border-[#3D224D] bg-white dark:bg-[#200B2B] text-xs min-w-0', hoje = isoDay(new Date());

      const pessoas = pdData.people.slice().sort((a, b) => a.name.localeCompare(b.name, 'pt-BR')).map(p =>
        '<div class="flex items-start justify-between gap-2 py-2 border-t border-[#EFE1F5] dark:border-[#3D224D]"><div class="min-w-0"><p class="text-sm font-bold truncate">' + esc(p.name) + (p.rel ? ' <span class="text-[11px] font-normal text-[#8B7D95]">' + esc(p.rel) + '</span>' : '') + '</p>' +
        '<p class="text-[11px] text-[#8B7D95]">' + (p.bm ? 'Aniversário ' + p.bd + ' de ' + PD_MESES[p.bm - 1].toLowerCase() + (p.by ? ' de ' + p.by : '') : 'Sem aniversário') + (p.phone ? ' · ' + esc(p.phone) : '') + '</p>' + (p.note ? '<p class="text-[11px] mt-0.5">' + esc(p.note) + '</p>' : '') + '</div>' +

    function hairCardHtml() {

    // ================= Medidas corporais: registro por data, gráfico e histórico =================
    function medDateKey() { return medDate && validIsoDate(medDate) ? medDate : isoDay(new Date()); }
    function measureSeries(field) {
      return Object.keys(dayLog).sort().map(k => ({ k, v: (dayLog[k] || {})[field] })).filter(p => p.v > 0);
    }
    function syncLatestMeasures() {
      Object.keys(MEASURES).forEach(f => { const ult = measureSeries(f).pop(); healthData[f] = ult ? String(ult.v).replace('.', ',') : ''; });
      setStore('health', healthData);
    }
    function refreshMeasureChart() { const a = document.getElementById('measure-charts'); if (a) a.innerHTML = measureChartAreaHtml(); }
    function refreshMeasureRegistry() { const r = document.getElementById('measure-registry'); if (r) r.innerHTML = measureRegistryHtml(); }
    function afterMeasureChange() { syncLatestMeasures(); refreshMeasureChart(); refreshMeasureRegistry(); }
    function setMedDate(v) {
      const msg = document.getElementById('measure-msg');
      if (!validIsoDate(v) || v > isoDay(new Date())) { if (msg) msg.textContent = 'Escolha uma data válida, de hoje ou de antes.'; return; }
      medDate = v;
      renderScreen();
    }
    function setMedField(f) { if (MEASURES[f]) { medField = f; refreshMeasureChart(); } }
    function setMedRange(r) { medRange = r; refreshMeasureChart(); }
    function toggleMedReg() { medRegAll = !medRegAll; refreshMeasureRegistry(); }
    function saveMeasure(field, val) {
      const M = MEASURES[field], msg = document.getElementById('measure-msg'), key = medDateKey();
      const txt = String(val == null ? '' : val).trim();
      if (msg) msg.textContent = '';
      if (txt === '') { logDay(key, { [field]: null }); afterMeasureChange(); return; }
      if (!/^[0-9]+([.,][0-9]+)?\s*(kg|cm)?$/i.test(txt)) {
        if (msg) msg.textContent = M.label + ': use só números, como ' + (field === 'weight' ? '68,4' : '72,5') + '.';
        return;
      }
      const n = parseWeight(txt);
      if (n < M.min || n > M.max) {
        if (msg) msg.textContent = M.label + ': esse valor parece fora do normal. Confira e tente de novo.';
        return;
      }
      logDay(key, { [field]: n });
      const input = document.getElementById('health-' + field);
      if (input) input.value = String(n).replace('.', ',');
      afterMeasureChange();
    }
    function saveMeasureGoal(field, val) {
      const M = MEASURES[field], msg = document.getElementById('measure-msg');
      const txt = String(val == null ? '' : val).trim(), nome = 'Meta de ' + M.label.toLowerCase();
      if (msg) msg.textContent = '';

      if (txt === '') { delete healthData.goals[field]; setStore('health', healthData); refreshMeasureChart(); return; }
      if (!/^[0-9]+([.,][0-9]+)?\s*(kg|cm)?$/i.test(txt)) { if (msg) msg.textContent = nome + ': use só números, como ' + (field === 'weight' ? '62' : '68,5') + '.'; return; }
      const n = parseWeight(txt);
      if (n < M.min || n > M.max) { if (msg) msg.textContent = nome + ': esse valor parece fora do normal. Confira e tente de novo.'; return; }
      healthData.goals[field] = String(n).replace('.', ',');
      setStore('health', healthData);
      const input = document.getElementById('goal-' + field);
      if (input) input.value = healthData.goals[field];

    }
    function editMeasureDate(k) {
      medDate = k;

    }
    function deleteMeasureDate(k) {
      if (!confirm('Apagar todas as medidas de ' + fmtDMY(k) + '?')) return;
      const patch = {};
      Object.keys(MEASURES).forEach(f => { patch[f] = null; });
      logDay(k, patch);
      syncLatestMeasures();
      renderScreen();
    }
    function measureChartSvg(field, range) {
      const M = MEASURES[field], all = measureSeries(field), hoje = isoDay(new Date()), now = new Date();
      const cls = 'text-xs text-[#8B7D95] dark:text-[#C1B1CB]';
      if (!all.length) return '<p class="' + cls + '">Ainda não há registros de ' + M.label.toLowerCase() + '. Preencha o campo ao lado e o gráfico aparece aqui.</p>';
      const startKey = range ? isoDay(new Date(now.getFullYear(), now.getMonth(), now.getDate() - range)) : all[0].k;
      const pts = all.filter(p => p.k >= startKey), last = all[all.length - 1];
      if (!pts.length) return '<p class="' + cls + '">Sem registros neste período. O último foi em ' + fmtDMY(last.k) + ': ' + fmtH(last.v) + ' ' + M.unit + '.</p>';
      const goal = parseWeight((healthData.goals || {})[field]), temMeta = goal > 0, span = Math.max(1, daysBetween(startKey, hoje));
      const vals = pts.map(p => p.v).concat(temMeta ? [goal] : []);
      let lo = Math.min(...vals), hi = Math.max(...vals);
      const pad = Math.max((hi - lo) * 0.18, hi * 0.01, 0.5); lo -= pad; hi += pad;
      const W = 320, H = 200, padL = 40, padR = 14, top = 18, bot = 28;
      const x = k => padL + (W - padL - padR) * Math.min(1, daysBetween(startKey, k) / span), y = v => top + (H - top - bot) * (1 - (v - lo) / (hi - lo));
      const fy = v => v.toFixed((hi - lo) < 6 ? 1 : 0).replace('.', ',');
      const first = pts[0], lastP = pts[pts.length - 1];
      let g = '<svg viewBox="0 0 ' + W + ' ' + H + '" class="w-full h-auto text-[#8B7D95] dark:text-[#C1B1CB]" role="img" aria-label="' + M.label + ' de ' + fmtDM(first.k) + ' a ' + fmtDM(lastP.k) + ': de ' + fmtH(first.v) + ' a ' + fmtH(lastP.v) + ' ' + M.unit + '.">';
      for (let j = 0; j < 4; j++) {
        const v = lo + (hi - lo) * j / 3;
        g += '<line x1="' + padL + '" x2="' + (W - padR) + '" y1="' + y(v).toFixed(1) + '" y2="' + y(v).toFixed(1) + '" stroke="currentColor" stroke-opacity=".18"/>' +
          '<text x="' + (padL - 6) + '" y="' + (y(v) + 3).toFixed(1) + '" text-anchor="end" font-size="10" fill="currentColor">' + fy(v) + '</text>';
      }
      const meio = isoDay(new Date(now.getFullYear(), now.getMonth(), now.getDate() - Math.round(span / 2)));
      const marcas = span >= 6 ? [[startKey, 'start'], [meio, 'middle'], [hoje, 'end']] : [[startKey, 'start'], [hoje, 'end']];
      marcas.filter((m, n) => n === 0 || m[0] !== marcas[n - 1][0]).forEach(m => { g += '<text x="' + x(m[0]).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="' + m[1] + '" font-size="10" fill="currentColor"' + (m[0] === hoje ? ' font-weight="700"' : '') + '>' + (m[0] === hoje ? 'hoje' : fmtDM(m[0])) + '</text>'; });
      if (temMeta) g += '<line x1="' + padL + '" x2="' + (W - padR) + '" y1="' + y(goal).toFixed(1) + '" y2="' + y(goal).toFixed(1) + '" stroke="#C6A467" stroke-width="1.5" stroke-dasharray="5 4"/>' +
        '<text x="' + (W - padR) + '" y="' + (y(goal) - 4).toFixed(1) + '" text-anchor="end" font-size="10" fill="#C6A467" font-weight="700">meta ' + fy(goal) + '</text>';
      if (pts.length > 1) g += '<polyline fill="none" stroke="#8266C4" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="' + pts.map(p => x(p.k).toFixed(1) + ',' + y(p.v).toFixed(1)).join(' ') + '"/>';
      pts.forEach((p, n) => {
        const ultimo = n === pts.length - 1;
        g += '<circle cx="' + x(p.k).toFixed(1) + '" cy="' + y(p.v).toFixed(1) + '" r="' + (ultimo ? 5 : 3) + '" fill="' + (ultimo ? '#C6A467' : '#8266C4') + '"><title>' + fmtDM(p.k) + ': ' + fmtH(p.v) + ' ' + M.unit + '</title></circle>';
      });
      [pts.length > 1 ? first : null, lastP].forEach((p, n) => {
        if (!p) return;
        const ax = x(p.k), anc = ax > W - 40 ? 'end' : ax < padL + 24 ? 'start' : 'middle';
        g += '<text x="' + ax.toFixed(1) + '" y="' + Math.max(10, y(p.v) - 9).toFixed(1) + '" text-anchor="' + anc + '" font-size="10" font-weight="700" fill="currentColor">' + fmtH(p.v) + '</text>';
      });
      g += '</svg>';
      const d = lastP.v - first.v, sinal = d > 0 ? '+' : d < 0 ? '−' : '';
      return g + '<p class="text-xs mt-2"><strong>Atual:</strong> ' + fmtH(last.v) + ' ' + M.unit + ' em ' + fmtDM(last.k) + '.' +
        (pts.length > 1 ? ' <strong>No período:</strong> ' + sinal + fmtH(Math.abs(d)) + ' ' + M.unit + '.' : ' Registre em outro dia para ver a evolução.') + '</p>';
    }
    function measureGoalHtml(field) {
      const M = MEASURES[field], g = parseWeight((healthData.goals || {})[field]);
      if (!(g > 0)) return '';
      const cur = parseWeight(healthData[field]);
      let txt;
      if (!(cur > 0)) txt = 'Meta: ' + fmtH(g) + ' ' + M.unit + '. Registre a medida para ver quanto falta.';
      else if (Math.abs(cur - g) < 0.05) txt = 'Meta atingida: ' + fmtH(g) + ' ' + M.unit + '.';
      else txt = 'Faltam ' + fmtH(Math.abs(cur - g)) + ' ' + M.unit + ' para a meta de ' + fmtH(g) + ' ' + M.unit + '.';
      return '<p class="text-xs text-[#8B7D95] dark:text-[#C1B1CB] mt-0.5">' + txt + '</p>';
    }
    function measureChartAreaHtml() {
      const campos = Object.keys(MEASURES).filter(f => f === 'weight' || measureSeries(f).length || parseWeight((healthData.goals || {})[f]) > 0);
      if (!campos.includes(medField)) medField = 'weight';
      const chip = (on, onclick, txt) => '<button onclick="' + onclick + '" aria-pressed="' + on + '" class="px-3 py-1.5 rounded-full border text-[11px] font-bold ' + (on ? 'border-[#A56ABD] bg-[#A56ABD] text-white' : 'border-[#EFE1F5] dark:border-[#3D224D] bg-[#FAF5FC] dark:bg-[#2C153A]') + '">' + txt + '</button>';
      return '<div class="flex flex-wrap gap-1.5 mb-2">' + campos.map(f => chip(f === medField, "setMedField('" + f + "')", MEASURES[f].label)).join('') + '</div>' +
        '<div class="flex gap-1.5 mb-3">' + [[30, '30 dias'], [90, '90 dias'], [0, 'Tudo']].map(r => chip(medRange === r[0], 'setMedRange(' + r[0] + ')', r[1])).join('') + '</div>' +
        measureChartSvg(medField, medRange) + measureGoalHtml(medField);
    }
    function measureRegistryHtml() {
      const keys = Object.keys(dayLog).sort().reverse().filter(k => Object.keys(MEASURES).some(f => (dayLog[k] || {})[f] > 0));
      if (!keys.length) return '<p class="text-xs text-[#8B7D95] dark:text-[#C1B1CB]">Nenhum registro ainda.</p>';
      const vis = medRegAll ? keys : keys.slice(0, 6);
      const rows = vis.map(k => {
        const partes = Object.keys(MEASURES).filter(f => (dayLog[k] || {})[f] > 0).map(f => MEASURES[f].label + ' ' + fmtH(dayLog[k][f]) + ' ' + MEASURES[f].unit);
        return '<div class="p-3 rounded-xl bg-[#FAF5FC] dark:bg-[#2C153A] border border-[#EFE1F5] dark:border-[#3D224D] flex items-start justify-between gap-3"><div class="min-w-0"><p class="text-xs font-bold">' + fmtDMY(k) + ', ' + weekdayShort(k) + '</p>' +
          '<p class="text-[11px] text-[#8B7D95] dark:text-[#C1B1CB]">' + partes.join(' · ') + '</p></div>' +
          '<div class="flex gap-3 shrink-0 text-[11px] font-semibold"><button onclick="editMeasureDate(\'' + k + '\')" class="text-[#A56ABD] underline">Editar</button>' +
          '<button onclick="deleteMeasureDate(\'' + k + '\')" class="text-[#8B7D95] hover:text-red-500 underline">Apagar</button></div></div>';

      return '<div class="space-y-2">' + rows + '</div>' +
        (keys.length > 6 ? '<button onclick="toggleMedReg()" class="mt-2 text-xs font-semibold text-[#A56ABD] underline">' + (medRegAll ? 'Mostrar só os 6 mais recentes' : 'Ver todos (' + keys.length + ')') + '</button>' : '');
    }
    function measuresCardHtml() {
      const hoje = isoDay(new Date()), key = medDateKey(), dia = dayLog[key] || {};
      const linhas = Object.keys(MEASURES).map(f => {
        const M = MEASURES[f], v = dia[f] > 0 ? String(dia[f]).replace('.', ',') : '', ult = measureSeries(f).pop();
        return `<div class="grid grid-cols-[1fr_5rem_5rem] gap-2 items-center">

                </div>`;
      }).join('');
      return `          <div class="md:col-span-2 custom-card rounded-2xl p-6">
            <h2 class="font-serif-display text-xl font-bold mb-4">Medidas Corporais</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

    // ================= Rotina alimentar: cardápio da semana, kcal e proteína =================
    function emptyDays() { return Array.from({ length: 7 }, () => ({ t: '', k: 0, p: 0 })); }
    function ensureMeals() {
      if (!Array.isArray(healthData.meals)) {
        // Primeiro uso: transforma as linhas "Almoço: ..." do texto antigo em refeições; o que sobrar continua nas anotações.
        const meals = ['Café da manhã', 'Almoço', 'Lanche', 'Jantar'].map((n, i) => ({ id: i + 1, name: n, text: '' })), resto = [];
        String(healthData.dietNotes || '').split('\n').forEach(line => {
          const m = line.match(/^\s*(Café da manhã|Almoço|Lanche|Jantar)\s*:\s*(.*)$/i);
          const meal = m && meals.find(x => x.name.toLowerCase() === m[1].toLowerCase());
          if (meal && !meal.text) meal.text = m[2].trim(); else resto.push(line);
        });
        healthData.meals = meals;
        healthData.dietNotes = resto.join('\n').trim();
      }
      // Cardápio por dia: quem já tinha um texto por refeição começa com o mesmo texto nos 7 dias.
      healthData.meals.forEach(m => {
        if (!Array.isArray(m.days) || m.days.length !== 7) m.days = Array.from({ length: 7 }, () => ({ t: m.text || '', k: 0, p: 0 }));
      });
      setStore('health', healthData);
    }
    function menuIdx() { return menuDay == null ? todayIdx() : menuDay; }
    function mealEntry(m, i) { const e = m.days && m.days[i]; return e && typeof e === 'object' ? e : { t: '', k: 0, p: 0 }; }

    function toggleMeal(id, key) {
      const hoje = isoDay(new Date()), k = key || hoje;

    function refreshMealTotals() { const el = document.getElementById('meal-totals'); if (el) el.innerHTML = mealTotalsHtml(); }

      const m = healthData.meals.find(x => x.id === id), msg = document.getElementById('meal-msg');
      if (!m) return;
      if (!Array.isArray(m.days) || m.days.length !== 7) m.days = emptyDays();
      if (msg) msg.textContent = '';
      if (field === 't') { m.days[i].t = String(val).slice(0, 500); setStore('health', healthData); return; }
      const txt = String(val == null ? '' : val).trim(), max = field === 'k' ? 10000 : 1000;
      let n = 0;
      if (txt !== '') {
        if (!/^[0-9]+([.,][0-9]+)?$/.test(txt)) { if (msg) msg.textContent = (field === 'k' ? 'Calorias' : 'Proteína') + ': use só números.'; return; }
        n = Math.round(parseWeight(txt) * 10) / 10;
        if (n > max) { if (msg) msg.textContent = (field === 'k' ? 'Calorias' : 'Proteína') + ': o valor máximo é ' + fmtPassos(max) + '.'; return; }
      }
      m.days[i][field] = n;
      setStore('health', healthData);
      refreshMealTotals();
    }
    function saveFoodGoal(field, val) {
      const msg = document.getElementById('meal-msg'), txt = String(val == null ? '' : val).trim(), max = field === 'kcalGoal' ? 10000 : 1000;
      if (msg) msg.textContent = '';
      if (txt === '') { delete healthData[field]; setStore('health', healthData); refreshMealTotals(); return; }
      const n = /^[0-9]+$/.test(txt) ? parseInt(txt, 10) : NaN;
      if (isNaN(n) || n < 1 || n > max) { if (msg) msg.textContent = 'Meta: digite um número inteiro entre 1 e ' + fmtPassos(max) + '.'; return; }

          </div>

    // ================= Lista de compras =================
    function shopItems() { return listOf('shop'); }
    function shopKey(n) { return String(n).toLowerCase().replace(/\s*\(×\d+\)\s*$/, '').trim(); }
    function toggleShop(id) { healthData.shop = shopItems().map(it => it.id === id ? Object.assign({}, it, { done: !it.done }) : it); setStore('health', healthData); renderScreen(); }
    function deleteShop(id) { healthData.shop = shopItems().filter(it => it.id !== id); setStore('health', healthData); renderScreen(); }
    function clearShopDone() { healthData.shop = shopItems().filter(it => !it.done); setStore('health', healthData); renderScreen(); }
    function addShop() {
      const input = document.getElementById('new-shop-name'), msg = document.getElementById('shop-msg');
      const name = input ? input.value.trim().slice(0, 60) : '';
      if (msg) msg.textContent = '';
      if (!name) { if (msg) msg.textContent = 'Escreva o item.'; return; }
      if (shopItems().some(it => shopKey(it.name) === shopKey(name))) { if (msg) msg.textContent = 'Esse item já está na lista.'; return; }
      healthData.shop = shopItems().concat({ id: Date.now(), name, done: false });
      setStore('health', healthData);
      renderScreen();
    }
    function shopFromMenu() {
      const msg = document.getElementById('shop-msg'), contagem = new Map();
      listOf('meals').forEach(m => (m.days || []).forEach(d => {
        String((d && d.t) || '').split(/[+,;\n]| e /i).map(x => x.trim().replace(/\s+/g, ' ')).filter(x => x.length >= 2 && x.length <= 40).forEach(item => {
          const k = item.toLowerCase(), cur = contagem.get(k);
          if (cur) cur.n++; else contagem.set(k, { name: item.charAt(0).toUpperCase() + item.slice(1), n: 1 });
        });
      }));
      if (!contagem.size) { if (msg) msg.textContent = 'O cardápio está vazio. Escreva os alimentos separados por + ou vírgula.'; return; }
      const existentes = new Set(shopItems().map(it => shopKey(it.name)));
      let novos = 0, base = Date.now();
      const lista = shopItems().slice();
      contagem.forEach((v, k) => {
        if (existentes.has(k)) return;
        lista.push({ id: base + novos, name: v.name + (v.n > 1 ? ' (×' + v.n + ')' : ''), done: false });
        novos++;
      });
      if (!novos) { if (msg) msg.textContent = 'Nada novo para adicionar: tudo do cardápio já está na lista.'; return; }
      healthData.shop = lista;
      setStore('health', healthData);
      renderScreen();
    }
    function shopCardHtml() {
      const itens = shopItems(), comprados = itens.filter(it => it.done).length;
      const linhas = itens.map(it => `
              <div class="p-3 rounded-xl bg-[#FAF5FC] dark:bg-[#2C153A] border border-[#EFE1F5] dark:border-[#3D224D] flex items-center justify-between gap-2">

      return `          <div class="md:col-span-2 custom-card rounded-2xl p-6">

    function saveWeight(val) { saveMeasure('weight', val); }

      healthData.dietNotes = val;
